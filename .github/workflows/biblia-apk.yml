name: Bíblia JG — gerar APK

on:
  push:
    paths:
      - "biblia_jg/**"
      - ".github/workflows/biblia-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: biblia_jg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Verificar código
        run: flutter analyze

      - name: Testes
        run: flutter test

      # Assinatura fixa (opcional): crie os secrets ANDROID_KEYSTORE_BASE64,
      # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS e ANDROID_KEY_PASSWORD.
      # Sem eles o APK sai assinado com uma chave de debug.
      - name: Chave de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=$STORE_PW"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PW"
            } > android/key.properties
            echo "Usando chave de assinatura dos secrets."
          else
            echo "Secrets de assinatura ausentes: usando chave de debug."
          fi

      - name: Gerar APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Renomear APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "build/biblia-jg-build-${{ github.run_number }}.apk"

      - name: Guardar APK no run
        uses: actions/upload-artifact@v4
        with:
          name: biblia-jg-apk
          path: biblia_jg/build/biblia-jg-build-${{ github.run_number }}.apk

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: biblia-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Bíblia JG — build ${{ github.run_number }}
          body: |
            APK para Android/tablet gerado automaticamente.
            Baixe o arquivo **biblia-jg-build-${{ github.run_number }}.apk** abaixo e abra no tablet para instalar.
          files: biblia_jg/build/biblia-jg-build-${{ github.run_number }}.apk
          make_latest: true
