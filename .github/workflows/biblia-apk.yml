name: Bíblia JG — gerar APK

on:
  push:
    paths:
      - "biblia_jg/**"
      - ".github/workflows/biblia-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: biblia_jg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Cache dos textos bíblicos
        uses: actions/cache@v4
        with:
          path: ~/.cache/biblia-jg-bibles
          key: bibles-${{ hashFiles('biblia_jg/tool/bibles_manifest.json') }}

      - name: Baixar versões da Bíblia
        run: python3 tool/fetch_bibles.py --cache ~/.cache/biblia-jg-bibles

      - name: Verificar código
        run: flutter analyze

      - name: Testes
        run: flutter test

      # Assinatura fixa (opcional): crie os secrets ANDROID_KEYSTORE_BASE64,
      # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS e ANDROID_KEY_PASSWORD.
      # Sem eles o APK sai assinado com uma chave de debug.
      - name: Chave de assinatura
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            # Remove espaços e quebras de linha que entram ao copiar e colar.
            B64=$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]')
            STORE_PW=$(printf '%s' "$STORE_PW" | tr -d '[:space:]')
            KEY_PW=$(printf '%s' "$KEY_PW" | tr -d '[:space:]')
            KEY_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d '[:space:]')
            echo "ANDROID_KEYSTORE_BASE64 tem ${#B64} caracteres (esperado: 5736)."
            if ! printf '%s' "$B64" | base64 -d > android/app/release.jks 2>/dev/null; then
              echo "::error::ANDROID_KEYSTORE_BASE64 não é um texto válido (${#B64} caracteres, esperado 5736). Copie de novo a linha longa do arquivo do Drive, inteira."
              exit 1
            fi
            if ! keytool -list -v -keystore android/app/release.jks -storepass "$STORE_PW" -alias "$KEY_ALIAS" > keyinfo.txt 2>&1; then
              echo "::error::A chave abriu, mas a senha (ANDROID_KEYSTORE_PASSWORD) ou o nome (ANDROID_KEY_ALIAS) não conferem."
              exit 1
            fi
            echo "Impressão digital da chave (esperada 0E:F3:62:0F:...:D3:18):"
            grep -E "SHA256:" keyinfo.txt
            rm -f keyinfo.txt
            {
              echo "storeFile=release.jks"
              echo "storePassword=$STORE_PW"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PW"
            } > android/key.properties
            echo "Usando chave de assinatura dos secrets."
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Secrets de assinatura ausentes: usando chave de debug."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Gerar APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Renomear APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "build/biblia-jg-build-${{ github.run_number }}.apk"

      - name: Guardar APK no run
        uses: actions/upload-artifact@v4
        with:
          name: biblia-jg-apk
          path: biblia_jg/build/biblia-jg-build-${{ github.run_number }}.apk

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: biblia-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Bíblia JG — build ${{ github.run_number }}
          body: |
            APK para Android/tablet gerado automaticamente.
            Baixe o arquivo **biblia-jg-build-${{ github.run_number }}.apk** abaixo e abra no tablet para instalar.
            ${{ steps.sign.outputs.signed == 'true' && 'Assinado com a chave fixa: o app instalado recebe esta atualização pelo aviso "Nova versão disponível".' || 'Pré-versão com chave temporária: não é oferecida como atualização dentro do app.' }}
          files: biblia_jg/build/biblia-jg-build-${{ github.run_number }}.apk
          # Só builds com a chave fixa viram "latest" (é o que o app consulta para se atualizar).
          prerelease: ${{ steps.sign.outputs.signed != 'true' }}
          make_latest: ${{ steps.sign.outputs.signed == 'true' }}
