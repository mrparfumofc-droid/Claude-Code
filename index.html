async function trocarSenha(){
  const atual = prompt('Senha atual:'); if(atual === null) return;
  const nova = prompt('Nova senha (mín. 6 caracteres):'); if(nova === null) return;
  if(nova.length < 6){ showToast('A nova senha precisa ter 6+ caracteres'); return; }
  const r = await api('trocar_senha', { atual, nova });
  if(r.ok){ nuvem.token = r.json.token; try{ localStorage.setItem(TOKEN_KEY, nuvem.token); }catch(e){} showToast('Senha alterada. Outros aparelhos precisarão entrar de novo.'); }
  else showToast(r.json.erro === 'senha_incorreta' ? 'Senha atual incorreta' : 'Não foi possível trocar a senha');

async function iniciarNuvem(){
  try{ nuvem.token = localStorage.getItem(TOKEN_KEY); }catch(e){}
  const sync = lerSync(); nuvem.versao = sync.versao || 0; nuvem.pendente = !!sync.pendente;
  try{
    const st = await api('status');
    if(!st.json.configurado){ pedirLogin('', true); return; }
    if(!st.json.autenticado){ pedirLogin(); return; }
    await carregarDaNuvem();
  }catch(e){
    // sem internet: usa o que está salvo neste aparelho
    nuvem.online = false;
    if(nuvem.token){ nuvem.pronto = true; render(); showToast('Sem internet — usando dados deste aparelho'); setTimeout(iniciarNuvem, 15000); }
    else { pedirLogin('Sem conexão com o servidor. Verifique a internet e recarregue a página.'); }
  }

}

/* ==================== FOTOS ==================== */
function urlFoto(nome){ return nome ? API + '?acao=foto&n=' + encodeURIComponent(nome) : ''; }
let fotosEdit = [];
let fotosEditKey = null;
let fotosEnviando = 0;

function comprimirImagem(file, maxLado, qualidade){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight;
      const escala = Math.min(1, maxLado / Math.max(w, h));
      w = Math.round(w * escala); h = Math.round(h * escala);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h); ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', qualidade));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('imagem inválida')); };
    img.src = url;
  });
}

async function adicionarFotos(inputEl){
  const files = Array.from(inputEl.files || []);
  inputEl.value = '';
  if(!files.length) return;
  if(!nuvem.online){ showToast('Sem internet: não dá para enviar fotos agora'); return; }
  for(const f of files){
    if(fotosEdit.length + fotosEnviando >= 10){ showToast('Máximo de 10 fotos por produto'); break; }
    fotosEnviando++; renderFotosEdit();
    try{
      const dataUrl = await comprimirImagem(f, 1400, 0.82);
      const r = await api('enviar_foto', { imagem: dataUrl });
      if(r.ok){ fotosEdit.push(r.json.nome); }
      else showToast('Erro ao enviar foto: ' + (r.json.erro || r.status));
    }catch(e){ showToast('Não foi possível enviar uma das fotos'); }
    fotosEnviando--; renderFotosEdit();
  }
}
function removerFotoEdit(i){ fotosEdit.splice(i,1); renderFotosEdit(); }
function capaFotoEdit(i){ const [f] = fotosEdit.splice(i,1); fotosEdit.unshift(f); renderFotosEdit(); }
function moverFotoEdit(i, d){ const j = i + d; if(j<0 || j>=fotosEdit.length) return; [fotosEdit[i], fotosEdit[j]] = [fotosEdit[j], fotosEdit[i]]; renderFotosEdit(); }
function fotosEditHTML(){
  return fotosEdit.map((n,i)=>`
    <div class="foto-thumb ${i===0?'capa':''}">
      <img src="${urlFoto(n)}" alt="">
      ${i===0?'<span class="foto-capa-tag">CAPA</span>':''}
      <div class="foto-acoes">
        ${i>0?`<button type="button" title="Mover para esquerda" onclick="moverFotoEdit(${i},-1)">◀</button>`:''}
        ${i>0?`<button type="button" title="Usar como capa" onclick="capaFotoEdit(${i})">★</button>`:''}
        ${i<fotosEdit.length-1?`<button type="button" title="Mover para direita" onclick="moverFotoEdit(${i},1)">▶</button>`:''}
        <button type="button" title="Remover" onclick="removerFotoEdit(${i})">✕</button>
      </div>
    </div>`).join('') +
    (fotosEnviando ? Array.from({length:fotosEnviando}).map(()=>`<div class="foto-thumb enviando"><span>Enviando...</span></div>`).join('') : '') +
    (fotosEdit.length + fotosEnviando < 10 ? `<label class="foto-add"><input type="file" accept="image/*" multiple onchange="adicionarFotos(this)" style="display:none;"><span>📷</span><b>Adicionar fotos</b><small>câmera ou galeria</small></label>` : '');
}
function renderFotosEdit(){ const el = document.getElementById('p-fotos'); if(el) el.innerHTML = fotosEditHTML(); const n = document.getElementById('p-fotos-n'); if(n) n.textContent = fotosEdit.length; }

/* ==================== HELPERS DE PRODUTO / CATÁLOGO ==================== */
const STATUS_MANUAL = ['', 'Reservado', 'Inativo'];
function statusProduto(p){
  if(p.status === 'Inativo') return { txt:'Inativo', cls:'b-gray' };
  if((p.estoque||0) <= 0) return { txt:'Vendido', cls:'b-red' };
  if(p.status === 'Reservado') return { txt:'Reservado', cls:'b-orange' };
  return { txt:'Disponível', cls:'b-green' };
}
function precoAtual(p){ return (p.precoPromo && p.precoPromo > 0 && p.precoPromo < p.precoVenda) ? p.precoPromo : p.precoVenda; }
function capaProduto(p){ return (p.fotos && p.fotos.length) ? urlFoto(p.fotos[0]) : ''; }
function nomeMarca(p){ const m = p.marcaId ? state.marcas.find(x=>x.id==p.marcaId) : null; return m ? m.nome : ''; }
function semAcento(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,''); }
function sigla(s, n){ const t = semAcento(s).toUpperCase().replace(/[^A-Z0-9]/g,''); return t.slice(0, n) || 'X'.repeat(n); }
function gerarSku(dados, codigo){
  const cat = dados.categoria ? sigla(dados.categoria, 3) : 'GER';
  const mar = dados.marcaNome ? sigla(dados.marcaNome, 3) : 'SM';
  const tam = dados.variacoes ? sigla(dados.variacoes.split(/[ ,\/]/)[0], 3) : 'U';
  const num = String(codigo||'').replace(/\D/g,'') || String(state.contadorProduto).padStart(4,'0');
  let sku = `TEAR-${cat}-${mar}-${tam}-${num}`;
  return sku;
}
function preencherSkuAuto(){
  const marca = findMarcaByLabel(val('p-marca-busca'));
  const editing = state.editId ? state.produtos.find(p=>p.id===state.editId) : null;
  const codigo = editing ? editing.codigo : ('P' + String(state.contadorProduto).padStart(4,'0'));
  document.getElementById('p-sku').value = gerarSku({ categoria: val('p-categoria'), marcaNome: marca ? marca.nome : val('p-marca-busca'), variacoes: val('p-variacoes') }, codigo);
}
function medidasTexto(p){
  const m = p.medidas || {};
  const partes = [];
  if(m.busto) partes.push('Busto ' + m.busto + ' cm');
  if(m.cintura) partes.push('Cintura ' + m.cintura + ' cm');
  if(m.quadril) partes.push('Quadril ' + m.quadril + ' cm');
  if(m.ombro) partes.push('Ombro ' + m.ombro + ' cm');
  if(m.manga) partes.push('Manga ' + m.manga + ' cm');
  if(m.comprimento) partes.push('Comprimento ' + m.comprimento + ' cm');
  return partes.join(' · ');
}
function copiarTexto(txt){
  const ok = () => showToast('Texto copiado! É só colar no Instagram/WhatsApp');
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(ok).catch(()=>copiarFallback(txt, ok)); }
  else copiarFallback(txt, ok);
}
function copiarFallback(txt, ok){
  const ta = document.createElement('textarea'); ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); ok(); }catch(e){ showToast('Não foi possível copiar'); } document.body.removeChild(ta);
}
function gerarSkusFaltantes(){
  const sem = state.produtos.filter(p=>!p.sku);
  if(!sem.length) return;
  if(!confirmSafe('Gerar SKU automático para '+sem.length+' produto(s) sem SKU?')) return;
  const usados = new Set(state.produtos.filter(p=>p.sku).map(p=>p.sku.toLowerCase()));
  sem.forEach(p=>{ let sku = gerarSku({ categoria:p.categoria, marcaNome:nomeMarca(p), variacoes:p.variacoes }, p.codigo); let k=2; const base=sku; while(usados.has(sku.toLowerCase())) sku = base+'-'+(k++); usados.add(sku.toLowerCase()); p.sku = sku; });
  saveState(); render(); showToast('SKUs gerados');
}

}
function imprimirCatalogo(){
  const lista = filtrarCatalogo();
  if(!lista.length){ showToast('Nenhuma peça na lista atual'); return; }
  const corpo = `<div class="topo"><h1>Tear Brechó · Catálogo</h1><span>${new Date().toLocaleDateString('pt-BR')} · ${lista.length} peça(s)</span></div>

      const capa = capaProduto(p); const marca = nomeMarca(p);

      return `<div class="item"><div class="ft">${capa?`<img src="${capa}">`:'<div class="sf">sem foto</div>'}</div>

        <div class="pr">${promo?`<s>${fmt(p.precoVenda)}</s> `:''}${fmt(precoAtual(p))}</div><div class="sk">${esc(p.sku||p.codigo)}</div></div></div>`;
    }).join('')}</div>`;
  abrirJanelaImpressao('Catálogo Tear Brechó', corpo, `

    .tx{padding:8px 10px;} .mc{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#87341c;font-weight:700;}
    .nm{font-weight:700;font-size:13px;margin:2px 0;} .mt{font-size:11px;color:#78716c;}
    .pr{font-size:15px;font-weight:800;margin-top:4px;} .pr s{font-weight:400;color:#a8a29e;font-size:12px;} .sk{font-size:10px;color:#a8a29e;}
    @media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr);}}

}
