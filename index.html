<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Painel Tear Brechó</title>
<style>
  :root{ color-scheme: light; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f3f1ec;color:#292524;}
  .container{display:flex;min-height:100vh;}
  .sidebar{width:250px;background:#87341c;color:#fff;padding:20px 18px;overflow-y:auto;flex-shrink:0;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .brand img{width:52px;height:auto;display:block;border-radius:6px;}
  .brand-text h1{font-size:20px;margin:0;font-weight:700;line-height:1.1;}
  .brand-text span{font-size:10px;letter-spacing:.5px;opacity:.8;text-transform:uppercase;}
  .sidebar hr{border:none;border-top:1px solid rgba(255,255,255,.2);margin:16px 0;}
  .nav-btn{width:100%;text-align:left;padding:11px 12px;border:none;background:transparent;color:#fff;cursor:pointer;border-radius:6px;margin-bottom:6px;font-size:13.5px;display:flex;align-items:center;gap:8px;transition:background .15s;}
  .nav-btn:hover{background:rgba(255,255,255,.12);}
  .nav-btn.active{background:rgba(255,255,255,.22);font-weight:700;}
  .sidebar-footer{margin-top:24px;font-size:11px;opacity:.65;line-height:1.5;}
  .content{flex:1;overflow-y:auto;padding:28px 32px;max-width:1400px;}
  .header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
  .header h2{font-size:26px;font-weight:800;color:#292524;margin:0;}
  .header .sub{font-size:13px;color:#78716c;margin-top:4px;}
  .header-actions{display:flex;gap:8px;}
  .btn{padding:9px 16px;border:none;border-radius:7px;cursor:pointer;font-size:13.5px;font-weight:600;transition:filter .15s;}
  .btn:hover{filter:brightness(0.92);}
  .btn-primary{background:#87341c;color:#fff;}
  .btn-success{background:#2f9e44;color:#fff;}
  .btn-danger{background:#e03131;color:#fff;}
  .btn-gray{background:#e5e0d8;color:#44403c;}
  .btn-outline{background:#fff;color:#87341c;border:1px solid #87341c;}
  .btn-sm{padding:5px 9px;font-size:12px;border-radius:5px;}
  .btn-icon{background:transparent;border:none;cursor:pointer;font-size:15px;padding:4px 6px;border-radius:5px;}
  .btn-icon:hover{background:#f1ede5;}
  .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px;}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px;}
  .grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:16px;}
  @media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}
  .card{background:#fff;padding:18px 20px;border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.06);border:1px solid #efeae1;}
  .stat{display:flex;justify-content:space-between;align-items:flex-start;}
  .stat-txt p:first-child{color:#78716c;font-size:12.5px;margin:0 0 6px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;}
  .stat-txt p:last-child{font-size:24px;font-weight:800;margin:0;color:#292524;}
  .stat-icon{font-size:26px;opacity:.85;}
  .stat.warn .stat-txt p:last-child{color:#e8590c;}
  .stat.good .stat-txt p:last-child{color:#2f9e44;}
  .stat.bad .stat-txt p:last-child{color:#e03131;}
  .card h3{margin:0 0 4px;font-size:15px;color:#292524;}
  .card .value{font-size:28px;font-weight:800;margin:6px 0 2px;}
  .card .desc{font-size:12px;color:#78716c;margin:0;}
  .panel{background:#fff;border-radius:12px;border:1px solid #efeae1;box-shadow:0 1px 2px rgba(0,0,0,.06);overflow:hidden;margin-bottom:20px;}
  .panel-title{padding:14px 18px;border-bottom:1px solid #f1ede5;font-weight:700;font-size:14.5px;display:flex;justify-content:space-between;align-items:center;}
  .form-card{background:#fdfbf7;border:1px solid #eee2d2;border-radius:12px;padding:18px;margin-bottom:18px;}
  .form-card h4{margin:0 0 12px;font-size:14px;color:#87341c;}
  .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .form-grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .fg{margin-bottom:2px;display:flex;flex-direction:column;gap:4px;}
  .fg label{font-size:11.5px;font-weight:700;color:#57534e;text-transform:uppercase;letter-spacing:.3px;}
  .fg input,.fg select,.fg textarea{padding:8px 10px;border:1px solid #ddd6c8;border-radius:6px;font-family:inherit;font-size:13.5px;background:#fff;}
  .fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:#87341c;}
  .form-actions{display:flex;gap:8px;margin-top:14px;}
  .toolbar{display:flex;gap:10px;padding:14px 18px;border-bottom:1px solid #f1ede5;flex-wrap:wrap;align-items:center;}
  .toolbar input[type=text]{padding:8px 12px;border:1px solid #ddd6c8;border-radius:7px;font-size:13px;flex:1;min-width:180px;}
  .table-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead{background:#f9f6f0;}
  th{padding:10px 14px;text-align:left;font-weight:700;color:#57534e;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid #efeae1;}
  td{padding:11px 14px;border-bottom:1px solid #f4f1ea;vertical-align:middle;}
  tbody tr:hover{background:#fbf9f5;}
  tbody tr.low-stock{background:#fff5f0;}
  .empty{text-align:center;color:#a8a29e;padding:30px;font-size:13px;}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10.5px;font-weight:700;color:#fff;letter-spacing:.3px;}
  .b-green{background:#2f9e44;} .b-red{background:#e03131;} .b-orange{background:#e8590c;} .b-gray{background:#78716c;} .b-blue{background:#1971c2;}
  .pill{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;background:#f1ede5;color:#57534e;}
  .tag-fixo{background:#e7f5ff;color:#1971c2;} .tag-variavel{background:#fff4e6;color:#e8590c;}
  .money-pos{color:#2f9e44;font-weight:700;} .money-neg{color:#e03131;font-weight:700;}
  .toast{position:fixed;top:18px;right:18px;background:#292524;color:#fff;padding:12px 18px;border-radius:8px;font-size:13.5px;box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:999;opacity:0;transform:translateY(-8px);transition:all .25s;}
  .toast.show{opacity:1;transform:translateY(0);}
  .alert-box{background:#fff4e6;border:1px solid #ffd8a8;border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:13px;color:#7a4a03;}
  .alert-box b{color:#e8590c;}
  .two-col{display:grid;grid-template-columns:1.3fr .7fr;gap:20px;align-items:start;}
  @media(max-width:1100px){.two-col{grid-template-columns:1fr;}}
  .mini-list{list-style:none;margin:0;padding:0;}
  .mini-list li{padding:8px 0;border-bottom:1px solid #f4f1ea;font-size:12.5px;display:flex;justify-content:space-between;}
  .mini-list li:last-child{border-bottom:none;}
  .empty-inline{color:#a8a29e;font-size:12.5px;padding:8px 0;}
  .hint{font-size:11.5px;color:#a8a29e;margin-top:2px;}
  .backup-box{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.2);}

  /* ==================== RESPONSIVO / MOBILE (iPhone + Android) ==================== */
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  @media (max-width: 860px){
    html, body{overflow-x:hidden;}
    /* no mobile a pagina inteira rola junto (um so contexto de scroll) — evita bug clássico
       de position:sticky dentro de um container com overflow-y:auto aninhado */
    .container{display:block;min-height:100vh;}
    .sidebar{
      display:block;width:100%;box-sizing:border-box;padding:10px 12px;
      padding-left:max(12px, env(safe-area-inset-left));
      padding-right:max(12px, env(safe-area-inset-right));
      padding-top:max(10px, env(safe-area-inset-top));
      position:relative;z-index:50;
      overflow:visible;
    }
    .brand{margin-bottom:0;gap:8px;}
    .brand img{width:34px;border-radius:5px;}
    .brand-text h1{font-size:15px;}
    .brand-text span{display:none;}
    .sidebar hr{display:none;}
    .sidebar-footer{display:none;}
    .nav-menu{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:10px;padding-bottom:2px;scrollbar-width:none;width:100%;}
    .nav-menu::-webkit-scrollbar{display:none;}
    .nav-btn{width:auto;flex:0 0 auto;white-space:nowrap;margin-bottom:0;padding:9px 13px;font-size:12.5px;border-radius:20px;display:inline-flex;align-items:center;}
    .content{display:block;flex:none;overflow:visible;padding:16px;padding-bottom:max(16px, env(safe-area-inset-bottom));max-width:100%;width:100%;box-sizing:border-box;}
    .header{flex-direction:column;align-items:stretch;gap:10px;}
    .header h2{font-size:21px;}
    .header .sub{font-size:12px;}
    .header-actions{display:flex;}
    .header-actions .btn{flex:1;}
    .grid-4,.grid-3,.grid-2{grid-template-columns:repeat(2,1fr);gap:10px;}
    .two-col{grid-template-columns:1fr;}
    .card{padding:14px 15px;border-radius:10px;}
    .stat-txt p:first-child{font-size:11px;}
    .stat-txt p:last-child{font-size:19px;}
    .stat-icon{font-size:21px;}
    .form-card{padding:14px;border-radius:10px;}
    .form-grid,.form-grid.cols-3{grid-template-columns:1fr;gap:10px;}
    .fg input,.fg select,.fg textarea{font-size:16px;padding:10px 11px;} /* 16px evita zoom automatico no iOS Safari */
    .form-actions .btn{flex:1;text-align:center;}
    .toolbar{padding:12px;}
    .toolbar input[type=text]{width:100%;min-width:0;font-size:16px;}
    table{font-size:12px;}
    th{padding:8px 10px;font-size:10.5px;}
    td{padding:9px 10px;}
    .btn{padding:10px 14px;}
    .btn-icon{padding:7px 8px;font-size:16px;}
    .toast{left:12px;right:12px;top:max(12px, env(safe-area-inset-top));text-align:center;}
    .panel-title{padding:12px 14px;font-size:13.5px;}
  }
  @media (max-width: 480px){
    .grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}
    .header h2{font-size:19px;}
    .brand-text h1{font-size:14px;}
  }

  .hidden{display:none!important;}
  /* ===== nuvem / login ===== */
  .nuvem-box{margin-top:14px;padding:10px 12px;background:rgba(255,255,255,.1);border-radius:8px;font-size:12px;line-height:1.4;}
  .nuvem-box .nuvem-links{margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;}
  .nuvem-box a{color:#fff;opacity:.8;font-size:11.5px;text-decoration:underline;cursor:pointer;}
  #login-overlay{position:fixed;inset:0;background:#87341c;display:none;align-items:center;justify-content:center;z-index:2000;padding:20px;}
  #login-overlay.show{display:flex;}
  .login-box{background:#fff;border-radius:16px;padding:28px 24px;width:100%;max-width:360px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.25);}
  .login-logo{font-size:40px;}
  .login-box h2{margin:6px 0 4px;color:#87341c;}
  .login-sub{font-size:13px;color:#78716c;margin:0 0 14px;}
  .login-msg{background:#fff4e6;color:#7a4a03;border-radius:8px;padding:8px 10px;font-size:12.5px;margin-bottom:10px;}
  .login-box input{width:100%;padding:12px;border:1px solid #ddd6c8;border-radius:8px;font-size:16px;margin-bottom:10px;}
  /* ===== fotos no formulário ===== */
  .fotos-wrap{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;}
  .foto-thumb{position:relative;width:110px;height:140px;border-radius:10px;overflow:hidden;background:#f3f1ec;border:2px solid transparent;}
  .foto-thumb.capa{border-color:#87341c;}
  .foto-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .foto-thumb.enviando{display:flex;align-items:center;justify-content:center;font-size:11px;color:#78716c;animation:pulsar 1s infinite alternate;}
  @keyframes pulsar{from{opacity:.5}to{opacity:1}}
  .foto-capa-tag{position:absolute;top:5px;left:5px;background:#87341c;color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px;}
  .foto-acoes{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:3px;padding:4px;background:linear-gradient(transparent,rgba(0,0,0,.55));}
  .foto-acoes button{background:rgba(255,255,255,.92);border:none;border-radius:5px;width:26px;height:26px;font-size:12px;cursor:pointer;padding:0;}
  .foto-add{width:110px;height:140px;border:2px dashed #c9bfae;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:#87341c;background:#fff;text-align:center;gap:2px;}
  .foto-add span{font-size:26px;} .foto-add b{font-size:12px;} .foto-add small{font-size:10px;color:#a8a29e;}
  .fg.full{grid-column:1/-1;}
  .fg textarea{min-height:80px;resize:vertical;}
  .medidas-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
  .medidas-grid input{width:100%;}
  .form-sec{grid-column:1/-1;font-size:12px;font-weight:800;color:#87341c;text-transform:uppercase;letter-spacing:.5px;margin-top:8px;padding-top:10px;border-top:1px dashed #e7dccb;}
  .sku-row{display:flex;gap:6px;} .sku-row input{flex:1;min-width:0;}
  .thumb-mini{width:42px;height:52px;border-radius:6px;object-fit:cover;display:block;background:#f3f1ec;cursor:pointer;}
  .thumb-vazio{width:42px;height:52px;border-radius:6px;background:#f3f1ec;display:flex;align-items:center;justify-content:center;font-size:16px;opacity:.6;}
  /* ===== catálogo ===== */
  .cat-toolbar select,.cat-toolbar .cat-tam{padding:8px 10px;border:1px solid #ddd6c8;border-radius:7px;font-size:13px;background:#fff;}
  .cat-toolbar .cat-tam{width:70px;}
  .cat-count{padding:10px 18px 0;font-size:12px;color:#a8a29e;}
  .cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;padding:14px 18px 20px;}
  .cat-card{background:#fff;border:1px solid #efeae1;border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;}
  .cat-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08);}
  .cat-foto{position:relative;aspect-ratio:3/4;background:#f3f1ec;}
  .cat-foto img{width:100%;height:100%;object-fit:cover;display:block;}
  .cat-semfoto{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px;color:#c9bfae;gap:6px;}
  .cat-semfoto span{font-size:12px;}
  .cat-semfoto.grande{min-height:320px;}
  .cat-status{position:absolute;top:8px;left:8px;}
  .cat-nfotos{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.55);color:#fff;font-size:10.5px;padding:2px 7px;border-radius:10px;}
  .cat-promo{position:absolute;top:8px;right:8px;background:#e03131;color:#fff;font-size:11px;font-weight:800;padding:3px 7px;border-radius:6px;}
  .cat-info{padding:10px 12px 12px;}
  .cat-marca{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:#87341c;font-weight:800;}
  .cat-nome{font-weight:700;font-size:13.5px;margin:2px 0 3px;line-height:1.25;}
  .cat-meta{font-size:11.5px;color:#78716c;min-height:14px;}
  .cat-preco{margin-top:6px;font-size:16px;} .cat-preco s{color:#a8a29e;font-size:12px;}
  .cat-sku{font-size:10.5px;color:#a8a29e;margin-top:2px;font-family:ui-monospace,monospace;}
  /* ===== modal ===== */
  #modal{position:fixed;inset:0;background:rgba(41,37,36,.55);display:none;align-items:flex-start;justify-content:center;z-index:1500;padding:30px 16px;overflow-y:auto;}
  #modal.show{display:flex;}
  body.modal-aberto{overflow:hidden;}
  .modal-box{background:#fff;border-radius:16px;max-width:920px;width:100%;position:relative;padding:20px;}
  .modal-x{position:absolute;top:10px;right:10px;border:none;background:#f1ede5;width:34px;height:34px;border-radius:50%;font-size:15px;cursor:pointer;z-index:2;}
  .modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
  .modal-foto-principal{position:relative;border-radius:12px;overflow:hidden;background:#f3f1ec;aspect-ratio:3/4;}
  .modal-foto-principal img{width:100%;height:100%;object-fit:contain;display:block;background:#f3f1ec;}
  .gal-nav{position:absolute;top:50%;transform:translateY(-50%);border:none;background:rgba(255,255,255,.9);width:38px;height:38px;border-radius:50%;font-size:22px;cursor:pointer;}
  .gal-nav.esq{left:8px;} .gal-nav.dir{right:8px;}
  .modal-thumbs{display:flex;gap:6px;margin-top:8px;overflow-x:auto;}
  .modal-thumbs img{width:56px;height:70px;object-fit:cover;border-radius:6px;cursor:pointer;opacity:.6;border:2px solid transparent;}
  .modal-thumbs img.ativa{opacity:1;border-color:#87341c;}
  .modal-nome{margin:4px 0 6px;font-size:21px;}
  .modal-preco{font-size:24px;font-weight:800;color:#292524;margin-bottom:12px;} .modal-preco s{font-size:15px;color:#a8a29e;font-weight:400;}
  .modal-ficha{font-size:12.5px;margin-bottom:12px;}
  .modal-ficha th{background:none;padding:5px 10px 5px 0;width:110px;font-size:11px;border-bottom:1px solid #f4f1ea;}
  .modal-ficha td{padding:5px 0;}
  .modal-desc{background:#fdfbf7;border:1px solid #eee2d2;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.5;margin-bottom:12px;}
  .modal-acoes{display:flex;gap:8px;flex-wrap:wrap;}
  @media (max-width: 860px){
    .modal-grid{grid-template-columns:1fr;}
    #modal{padding:0;}
    .modal-box{border-radius:0;min-height:100%;padding:14px;}
    .modal-acoes .btn{flex:1 1 100%;}
    .cat-grid{grid-template-columns:repeat(2,1fr);gap:10px;padding:12px;}
    .cat-toolbar select{flex:1 1 45%;font-size:16px;}
    .cat-toolbar .cat-tam{flex:1 1 45%;width:auto;font-size:16px;}
    .medidas-grid{grid-template-columns:repeat(3,1fr);}
    .foto-thumb,.foto-add{width:calc(33% - 7px);height:auto;aspect-ratio:3/4;}
    .nuvem-box{margin-top:8px;padding:6px 10px;font-size:11.5px;width:100%;}
    .backup-box{display:none;}
    .header-actions{flex-wrap:wrap;}
  }
</style>
</head>
<body>
<div class="container">

<script>
/* ==================== ESTADO E PERSISTÊNCIA ==================== */
const STORAGE_KEY = 'tearBrechoData';

function defaultState(){
  return {
    section: 'dashboard',
    fornecedores: [],
    marcas: [],
    produtos: [],
    clientes: [],
    movimentacoes: [],
    vendas: [],
    custos: [],
    contadorProduto: 1,
    showForm: false,
    editId: null,
    filtroProdutos: '',
    filtroClientes: '',
    filtroFluxo: 'todos',
    vendaCart: [],
    vendaForm: { clienteBusca:'', pagamento:'Dinheiro', data:'', taxaCartao:'', comissao:'', frete:'' },
    showQuickCliente: false,
    showQuickFornecedor: false,
    estoqueLote: false,
    estoqueLoteSel: {},
    vendaSelecionadas: {},
    catFiltro: { status:'disponiveis', ordem:'recentes' }
  };
}

let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed, { showForm:false, editId:null, vendaCart:[], vendaForm: defaultState().vendaForm, showQuickCliente:false, showQuickFornecedor:false, estoqueLote:false, estoqueLoteSel:{}, vendaSelecionadas:{} });
  }catch(e){
    return defaultState();
  }
}

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){ /* ignora erro de storage */ }
  if(typeof agendarSync === 'function') agendarSync();
}

/* ==================== HELPERS ==================== */
function esc(str){
  if(str === undefined || str === null) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function fmt(v){ return 'R$ ' + (Number(v)||0).toFixed(2).replace('.', ','); }
function todayStr(){ return new Date().toISOString().split('T')[0]; }
function currentMonthPrefix(){ return new Date().toISOString().slice(0,7); }
function uid(){ return Date.now() + Math.floor(Math.random()*1000); }
function val(id){ const el = document.getElementById(id); return el ? el.value.trim() : ''; }
function numVal(id){ const v = parseFloat(val(id)); return isNaN(v) ? 0 : v; }
function intVal(id){ const v = parseInt(val(id)); return isNaN(v) ? 0 : v; }

function confirmSafe(msg){
  try{ return window.confirm(msg); }catch(e){ return true; }
}

/* ==================== BUSCA COM AUTOCOMPLETE (datalist) ==================== */
function labelProduto(p){
  const marca = p.marcaId ? state.marcas.find(m=>m.id===p.marcaId) : null;
  return p.nome + (marca ? ' · '+marca.nome : '') + ' — ' + p.codigo;
}
function labelCliente(c){ return c.nome + (c.telefone ? ' — '+c.telefone : ''); }
function labelFornecedor(f){ return f.nome + (f.contato ? ' — '+f.contato : ''); }
function labelMarca(m){ return m.nome; }

function optsProdutos(list){ return (list||state.produtos).map(p=>`<option data-id="${p.id}" value="${esc(labelProduto(p))}">`).join(''); }
function optsClientes(list){ return (list||state.clientes).map(c=>`<option data-id="${c.id}" value="${esc(labelCliente(c))}">`).join(''); }
function optsFornecedores(list){ return (list||state.fornecedores).map(f=>`<option data-id="${f.id}" value="${esc(labelFornecedor(f))}">`).join(''); }
function optsMarcas(list){ return (list||state.marcas).map(m=>`<option data-id="${m.id}" value="${esc(labelMarca(m))}">`).join(''); }

function findProdutoByLabel(text){
  if(!text) return null;
  const t = text.trim();
  return state.produtos.find(p => labelProduto(p) === t) || state.produtos.find(p => p.nome.toLowerCase() === t.toLowerCase()) || null;
}
function findClienteByLabel(text){
  if(!text) return null;
  const t = text.trim();
  return state.clientes.find(c => labelCliente(c) === t) || state.clientes.find(c => c.nome.toLowerCase() === t.toLowerCase()) || null;
}
function findFornecedorByLabel(text){
  if(!text) return null;
  const t = text.trim();
  return state.fornecedores.find(f => labelFornecedor(f) === t) || state.fornecedores.find(f => f.nome.toLowerCase() === t.toLowerCase()) || null;
}
function findMarcaByLabel(text){
  if(!text) return null;
  const t = text.trim();
  return state.marcas.find(m => labelMarca(m) === t) || state.marcas.find(m => m.nome.toLowerCase() === t.toLowerCase()) || null;
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=> t.classList.remove('show'), 2200);
}

/* ==================== BACKUP (EXPORTAR / IMPORTAR ARQUIVO) ==================== */
function exportarBackup(){
  try{
    const dados = {
      fornecedores: state.fornecedores, marcas: state.marcas, produtos: state.produtos, clientes: state.clientes,
      movimentacoes: state.movimentacoes, vendas: state.vendas, custos: state.custos,
      contadorProduto: state.contadorProduto,
      exportadoEm: new Date().toISOString()
    };
    const blob = new Blob([JSON.stringify(dados, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const dataStr = todayStr();
    a.href = url;
    a.download = 'tear-brecho-backup-'+dataStr+'.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    showToast('Backup salvo em arquivo');
  }catch(e){
    showToast('Não foi possível gerar o backup');
  }
}

function importarBackup(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const dados = JSON.parse(e.target.result);
      if(!dados || typeof dados !== 'object'){ throw new Error('formato inválido'); }
      const camposEsperados = ['produtos','clientes','fornecedores'];
      const valido = camposEsperados.some(c => Array.isArray(dados[c]));
      if(!valido){ showToast('Arquivo não parece ser um backup do Tear Brechó'); inputEl.value=''; return; }
      if(!confirmSafe('Isso vai SUBSTITUIR todos os dados atuais pelos dados do arquivo. Deseja continuar?')){ inputEl.value=''; return; }
      state.fornecedores = dados.fornecedores || [];
      state.marcas = dados.marcas || [];
      state.produtos = dados.produtos || [];
      state.clientes = dados.clientes || [];
      state.movimentacoes = dados.movimentacoes || [];
      state.vendas = dados.vendas || [];
      state.custos = dados.custos || [];
      state.contadorProduto = dados.contadorProduto || (state.produtos.length + 1);
      state.showForm = false; state.editId = null; state.vendaCart = [];
      saveState();
      showToast('Backup restaurado com sucesso');
      render();
    }catch(err){
      showToast('Erro ao ler o arquivo de backup');
    }
    inputEl.value = '';
  };
  reader.readAsText(file);
}

/* ==================== RENDER PRINCIPAL ==================== */
function render(){
  // preserva foco e posição do cursor em inputs (ex: campo de busca) durante o re-render
  const active = document.activeElement;
  const activeId = active && active.id ? active.id : null;
  const selStart = (activeId && typeof active.selectionStart === 'number') ? active.selectionStart : null;

  const navMenu = document.querySelector('.nav-menu');
  navMenu.innerHTML = sections.map(s => `
    <button class="nav-btn ${s.id===state.section?'active':''}" onclick="navigate('${s.id}')">
      <span>${s.icon}</span><span>${s.label}</span>
    </button>
  `).join('');

  const content = document.getElementById('content');
  const renderers = {
    dashboard: renderDashboard,
    catalogo: renderCatalogo,
    produtos: renderProdutos,
    estoque: renderEstoque,
    vendas: renderVendas,
    clientes: renderClientes,
    fornecedores: renderFornecedores,
    marcas: renderMarcas,
    fluxo: renderFluxo
  };
  content.innerHTML = renderers[state.section] ? renderers[state.section]() : '';

  if(activeId){
    const el = document.getElementById(activeId);
    if(el && typeof el.focus === 'function'){
      el.focus();
      if(selStart !== null && typeof el.setSelectionRange === 'function'){
        try{ el.setSelectionRange(selStart, selStart); }catch(e){}
      }
    }
  }  if(typeof atualizarStatusNuvem === 'function') atualizarStatusNuvem();
}

  const valorEstoqueVenda = state.produtos.reduce((s,p)=>s+(p.estoque*p.precoVenda),0);
  const totalClientes = state.clientes.length;

  const mesAtual = currentMonthPrefix();
  const vendasMes = state.vendas.filter(v => v.data && v.data.startsWith(mesAtual));
  const faturamentoMes = vendasMes.reduce((s,v)=>s+v.total,0);

  const custosVariaveisMes = state.custos.filter(c=>c.tipo==='custo' && c.natureza==='variavel' && c.data && c.data.startsWith(mesAtual)).reduce((s,c)=>s+c.valor,0);

  const lucroMes = faturamentoMes + outrasReceitasMes - custosFixosMes - custosVariaveisMes;
  const ticketMedio = vendasMes.length ? faturamentoMes/vendasMes.length : 0;

      <div class="card stat"><div class="stat-txt"><p>Valor em estoque (custo)</p><p>${fmt(valorEstoqueCusto)}</p></div><div class="stat-icon">💵</div></div>
      <div class="card stat good"><div class="stat-txt"><p>Potencial de venda</p><p>${fmt(valorEstoqueVenda)}</p></div><div class="stat-icon">🏷️</div></div>
    </div>

    <div class="grid-4">

      <div class="card stat"><div class="stat-txt"><p>Vendas no mês</p><p>${vendasMes.length}</p></div><div class="stat-icon">🧾</div></div>
      <div class="card stat good"><div class="stat-txt"><p>Faturamento no mês</p><p>${fmt(faturamentoMes)}</p></div><div class="stat-icon">📈</div></div>
      <div class="card stat ${lucroMes>=0?'good':'bad'}"><div class="stat-txt"><p>Lucro líquido no mês</p><p>${fmt(lucroMes)}</p></div><div class="stat-icon">${lucroMes>=0?'✅':'⚠️'}</div></div>
    </div>

    <div class="grid-3">
      <div class="card stat"><div class="stat-txt"><p>Custos fixos (mês)</p><p style="color:#1971c2;">${fmt(custosFixosMes)}</p></div><div class="stat-icon">🏠</div></div>
      <div class="card stat"><div class="stat-txt"><p>Custos variáveis (mês)</p><p style="color:#e8590c;">${fmt(custosVariaveisMes)}</p></div><div class="stat-icon">🔀</div></div>

    </div>

    ${estoqueBaixo.length ? `
      <div class="alert-box">⚠️ <b>${estoqueBaixo.length} produto(s)</b> com estoque baixo (≤ ${ESTOQUE_BAIXO_LIMITE} unid.): ${estoqueBaixo.map(p=>esc(p.nome)+' ('+p.estoque+')').join(', ')}

    ` : ''}

    <div class="two-col">

function editarFornecedor(id){ state.editId = id; state.showForm = true; render(); }

function salvarFornecedor(id){
  const nome = val('f-nome'), contato = val('f-contato');
  if(!nome || !contato){ showToast('Preencha nome e contato'); return; }
  const dados = { nome, contato, email: val('f-email'), endereco: val('f-endereco'), comissaoPadrao: numVal('f-comissao') || null };
  if(id){
    const f = state.fornecedores.find(x=>x.id===id);
    Object.assign(f, dados);
    showToast('Fornecedor atualizado');
  }else{
    state.fornecedores.push({ id: uid(), ...dados });
    showToast('Fornecedor cadastrado');
  }
  saveState();
  fecharFormulario();
}

function deletarFornecedor(id){
  if(!confirmSafe('Excluir este fornecedor?')) return;
  state.fornecedores = state.fornecedores.filter(f=>f.id!==id);
  saveState();
  render();
}

function quickAddMarca(){

  if(!nome){ showToast('Preencha o nome da marca'); return; }
  const novo = { id: uid(), nome, descricao: val('pq-marca-descricao') };
  state.marcas.push(novo);
  saveState();
  const busca = document.getElementById('p-marca-busca');
  if(busca) busca.value = labelMarca(novo);
  const dl = document.getElementById('dl-marcas-produto');

  document.getElementById('pq-marca-nome').value = '';
  document.getElementById('pq-marca-descricao').value = '';
  document.getElementById('pq-marca-box').classList.add('hidden');
  showToast('Marca cadastrada');
}

function quickAddFornecedor(){

}

function salvarProduto(id){
  const nome = val('p-nome');
  const precoCusto = numVal('p-custo');
  const precoVenda = numVal('p-venda');
  if(!nome || !precoCusto || !precoVenda){ showToast('Preencha nome e os dois preços'); return; }
  if(fotosEnviando > 0){ showToast('Aguarde as fotos terminarem de enviar'); return; }
  const descTxt = (document.getElementById('p-descricao')||{}).value || '';
  if(!descTxt.trim()){ showToast('Escreva a descrição do produto'); document.getElementById('p-descricao').focus(); return; }
  if(fotosEdit.length < 3 && !confirmSafe('Este produto tem '+fotosEdit.length+' foto(s). Para o grupo de WhatsApp o ideal é 3 a 5 fotos.\n\nSalvar mesmo assim?')) return;
  const estoqueTxt = val('p-estoque');
  const estoque = estoqueTxt === '' ? (id ? 0 : 1) : intVal('p-estoque');
  const fornecedorResolvido = findFornecedorByLabel(val('p-fornecedor-busca'));
  const marcaResolvida = findMarcaByLabel(val('p-marca-busca'));
  const dados = {
    nome,
    sku: val('p-sku'),
    categoria: val('p-categoria'),
    estado: val('p-estado'),
    variacoes: val('p-variacoes'),
    fornecedorId: fornecedorResolvido ? fornecedorResolvido.id : null,
    marcaId: marcaResolvida ? marcaResolvida.id : null,
    dataEntrada: val('p-data-entrada') || todayStr(),
    precoCusto, precoVenda,
    lucro: precoVenda - precoCusto,
    estoque,
    precoPromo: numVal('p-promo') || 0,
    status: val('p-status'),
    descricao: (document.getElementById('p-descricao')||{}).value ? document.getElementById('p-descricao').value.trim() : '',
    cor: val('p-cor'),
    material: val('p-material'),
    epoca: val('p-epoca'),
    medidas: { busto: val('p-m-busto'), cintura: val('p-m-cintura'), quadril: val('p-m-quadril'), ombro: val('p-m-ombro'), manga: val('p-m-manga'), comprimento: val('p-m-comprimento') },
    localizacao: val('p-local'),
    tags: val('p-tags'),
    publicarWhatsapp: val('p-whats') !== 'nao',
    fotos: fotosEdit.slice()
  };
  const codigoFinal = id ? (state.produtos.find(x=>x.id===id)||{}).codigo : ('P' + String(state.contadorProduto).padStart(4,'0'));
  if(!dados.sku) dados.sku = gerarSku({ categoria: dados.categoria, marcaNome: marcaResolvida ? marcaResolvida.nome : '', variacoes: dados.variacoes }, codigoFinal);
  const skuRepetido = state.produtos.find(x => x.id !== id && x.sku && x.sku.toLowerCase() === dados.sku.toLowerCase());
  if(skuRepetido){ showToast('Esse SKU já está em uso por: ' + skuRepetido.nome); return; }
  if(id){
    const p = state.produtos.find(x=>x.id===id);
    Object.assign(p, dados);
    showToast('Produto atualizado');
  }else{
    const codigo = codigoFinal;
    state.contadorProduto++;
    state.produtos.push({ id: uid(), codigo, ...dados });
    showToast('Produto cadastrado');
  }
  saveState();
  fecharFormulario();
}

function deletarProduto(id){
  if(!confirmSafe('Excluir este produto? Isso não afeta vendas já registradas.')) return;
  state.produtos = state.produtos.filter(p=>p.id!==id);
  saveState();
  render();
}

function registrarEntradaLote(){
  const data = val('el-data') || todayStr();
  const observacao = val('el-obs') || 'Entrada em lote';
  const inputs = document.querySelectorAll('.lote-qtd');
  let count = 0;
  inputs.forEach(inp=>{
    const qtd = parseInt(inp.value);
    if(qtd > 0){
      const produtoId = parseInt(inp.getAttribute('data-produto-id'));
      const produto = state.produtos.find(p=>p.id===produtoId);
      if(produto){
        produto.estoque += qtd;
        state.movimentacoes.push({ id: uid(), produtoId, produtoNome: produto.nome, tipo:'entrada', quantidade: qtd, data, observacao });
        count++;
      }
    }
  });
  if(count===0){ showToast('Informe a quantidade de ao menos um produto'); return; }
  saveState();
  showToast(count+' produto(s) atualizados no estoque');
  fecharFormulario();
}

function revertMovimentacao(m){
  const produto = state.produtos.find(p=>p.id===m.produtoId);
  if(!produto) return;
  if(m.tipo==='entrada') produto.estoque = Math.max(0, produto.estoque - m.quantidade);
  else produto.estoque += m.quantidade;
}

function editarMovimentacao(id){ state.editId = id; state.showForm = true; state.estoqueLote = false; render(); }

function deletarMovimentacao(id){
  const m = state.movimentacoes.find(x=>x.id===id);
  if(!m) return;
  if(!confirmSafe('Excluir esta movimentação? O estoque será ajustado de volta.')) return;
  revertMovimentacao(m);
  state.movimentacoes = state.movimentacoes.filter(x=>x.id!==id);
  saveState();
  render();
}

function adicionarMovimentacao(){
  const produto = findProdutoByLabel(val('e-produto-busca'));
  const tipo = val('e-tipo');
  const quantidade = intVal('e-quantidade');
  const data = val('e-data') || todayStr();
  const observacao = val('e-obs');
  if(!produto || !tipo || !quantidade){ showToast('Selecione um produto válido, tipo e quantidade'); return; }

  let estoqueBase = produto.estoque;
  let antiga = null;
  if(state.editId){
    antiga = state.movimentacoes.find(m=>m.id===state.editId);
    if(antiga && antiga.produtoId===produto.id){
      estoqueBase = antiga.tipo==='entrada' ? estoqueBase - antiga.quantidade : estoqueBase + antiga.quantidade;
    }
  }
  if(tipo==='saida' && quantidade > estoqueBase){ showToast('Estoque insuficiente. Disponível: '+estoqueBase); return; }

  if(antiga){
    revertMovimentacao(antiga);
    state.movimentacoes = state.movimentacoes.filter(m=>m.id!==antiga.id);
  }

  state.movimentacoes.push({ id: state.editId || uid(), produtoId: produto.id, produtoNome: produto.nome, tipo, quantidade, data, observacao });
  if(tipo==='entrada') produto.estoque += quantidade;
  else produto.estoque = Math.max(0, produto.estoque - quantidade);

  saveState();
  showToast(state.editId ? 'Movimentação atualizada' : 'Movimentação registrada');
  fecharFormulario();
}

/* ==================== VENDAS ==================== */
function estoqueSimulado(produtoId){
  const produto = state.produtos.find(p=>p.id===produtoId);
  if(!produto) return 0;
  let base = produto.estoque;
  if(state.editId){
    const vendaAntiga = state.vendas.find(v=>v.id===state.editId);
    if(vendaAntiga) base += vendaAntiga.itens.filter(i=>i.produtoId===produtoId).reduce((s,i)=>s+i.quantidade,0);
  }
  const jaNoCarrinho = state.vendaCart.filter(i=>i.produtoId===produtoId).reduce((s,i)=>s+i.quantidade,0);
  return base - jaNoCarrinho;
}

function adicionarItemCarrinho(){
  const produto = findProdutoByLabel(val('v-produto-busca'));
  if(!produto){ showToast('Selecione um produto válido da lista'); return; }
  const quantidade = intVal('v-item-qtd') || 1;
  const precoDigitado = numVal('v-item-preco');
  const precoUnit = precoDigitado > 0 ? precoDigitado : produto.precoVenda;
  const disponivel = estoqueSimulado(produto.id);
  if(quantidade > disponivel){ showToast('Estoque insuficiente. Disponível: '+disponivel); return; }
  state.vendaCart.push({ produtoId: produto.id, produtoNome: produto.nome, quantidade, precoUnit, subtotal: Math.round(quantidade*precoUnit*100)/100 });
  document.getElementById('v-produto-busca').value = '';
  document.getElementById('v-item-qtd').value = '1';
  document.getElementById('v-item-preco').value = '';
  render();
}

function removerItemCarrinho(idx){
  state.vendaCart.splice(idx,1);
  render();
}

function quickAddCliente(){
  const nome = val('vq-cliente-nome');
  const telefone = val('vq-cliente-telefone');
  if(!nome || !telefone){ showToast('Preencha nome e telefone do cliente'); return; }
  const novo = { id: uid(), nome, telefone, email:'', endereco:'', instagram:'' };
  state.clientes.push(novo);
  saveState();
  state.vendaForm.clienteBusca = labelCliente(novo);
  state.showQuickCliente = false;
  showToast('Cliente cadastrado');
  render();
}

function editarVenda(id){
  const venda = state.vendas.find(v=>v.id===id);
  if(!venda) return;
  state.editId = id;
  state.showForm = true;
  state.vendaCart = venda.itens.map(i=>({...i}));
  state.vendaForm = {
    clienteBusca: venda.clienteId ? labelCliente(state.clientes.find(c=>c.id===venda.clienteId) || {nome:venda.clienteNome,telefone:''}) : (venda.clienteNome||''),
    pagamento: venda.formaPagamento || 'Dinheiro',
    data: venda.data || todayStr(),
    taxaCartao: venda.taxaCartao || '',
    comissao: venda.comissaoFornecedor || '',
    frete: venda.frete || ''
  };
  render();
}

function reverterEfeitosVenda(id){
  const venda = state.vendas.find(v=>v.id===id);
  if(!venda) return;
  venda.itens.forEach(item=>{
    const produto = state.produtos.find(p=>p.id===item.produtoId);
    if(produto) produto.estoque += item.quantidade;
  });
  state.movimentacoes = state.movimentacoes.filter(m=>m.vendaId!==id);
  state.custos = state.custos.filter(c=>c.vendaId!==id);
  state.vendas = state.vendas.filter(v=>v.id!==id);
}

function deletarVenda(id){
  if(!confirmSafe('Excluir esta venda? O estoque dos produtos será restaurado.')) return;
  reverterEfeitosVenda(id);
  saveState();
  showToast('Venda excluída e estoque restaurado');
  render();
}

function registrarVenda(){
  if(state.vendaCart.length===0){ showToast('Adicione ao menos um produto à venda'); return; }

  const clienteResolvido = findClienteByLabel(val('v-cliente-busca'));
  const clienteNomeDigitado = val('v-cliente-busca');
  const formaPagamento = val('v-pagamento') || 'Dinheiro';
  const data = val('v-data') || todayStr();
  const taxaCartao = numVal('v-taxa-cartao');
  const comissaoFornecedor = numVal('v-comissao');
  const frete = numVal('v-frete');
  const idVenda = state.editId || uid();

  if(state.editId) reverterEfeitosVenda(state.editId);

  for(const item of state.vendaCart){
    const produto = state.produtos.find(p=>p.id===item.produtoId);
    if(!produto || item.quantidade > produto.estoque){
      showToast('Estoque insuficiente para '+(produto?produto.nome:item.produtoNome)+'. Refaça a venda.');
      saveState();
      render();
      return;
    }
  }

  const total = state.vendaCart.reduce((s,i)=>s+i.subtotal,0);
  const venda = {
    id: idVenda, data, formaPagamento,
    clienteId: clienteResolvido ? clienteResolvido.id : null,
    clienteNome: clienteResolvido ? clienteResolvido.nome : clienteNomeDigitado,
    itens: state.vendaCart.map(i=>({...i})),
    total, taxaCartao, comissaoFornecedor, frete
  };
  state.vendas.push(venda);

  venda.itens.forEach(item=>{
    const produto = state.produtos.find(p=>p.id===item.produtoId);
    produto.estoque = Math.max(0, produto.estoque - item.quantidade);
    state.movimentacoes.push({ id: uid(), produtoId: item.produtoId, produtoNome: item.produtoNome, tipo:'saida', quantidade: item.quantidade, data, observacao:'Venda'+(venda.clienteNome?(' para '+venda.clienteNome):''), vendaId: venda.id });
  });

  const nomesResumo = venda.itens.map(i=>i.produtoNome).join(', ');
  state.custos.push({ id: uid(), tipo:'receita', natureza:null, categoria:'Venda', descricao: nomesResumo + (venda.clienteNome?(' - '+venda.clienteNome):''), valor: total, data, vendaId: venda.id });
  if(taxaCartao>0) state.custos.push({ id: uid(), tipo:'custo', natureza:'variavel', categoria:'Taxa de Cartão', descricao:'Taxa de cartão - venda de '+nomesResumo, valor: taxaCartao, data, vendaId: venda.id });
  if(comissaoFornecedor>0) state.custos.push({ id: uid(), tipo:'custo', natureza:'variavel', categoria:'Comissão Fornecedor', descricao:'Comissão - venda de '+nomesResumo, valor: comissaoFornecedor, data, vendaId: venda.id });
  if(frete>0) state.custos.push({ id: uid(), tipo:'custo', natureza:'variavel', categoria:'Frete', descricao:'Frete/embalagem - venda de '+nomesResumo, valor: frete, data, vendaId: venda.id });

  saveState();
  showToast(state.editId ? 'Venda atualizada' : 'Venda registrada com sucesso');
  fecharFormulario();
}

function editarCliente(id){ state.editId = id; state.showForm = true; render(); }

function salvarCliente(id){
  const nome = val('c-nome'), telefone = val('c-telefone');
  if(!nome || !telefone){ showToast('Preencha nome e telefone'); return; }
  const dados = { nome, telefone, email: val('c-email'), endereco: val('c-endereco'), instagram: val('c-instagram') };
  if(id){
    const c = state.clientes.find(x=>x.id===id);
    Object.assign(c, dados);
    showToast('Cliente atualizado');
  }else{
    state.clientes.push({ id: uid(), ...dados });
    showToast('Cliente cadastrado');
  }
  saveState();
  fecharFormulario();
}

function deletarCliente(id){
  if(!confirmSafe('Excluir este cliente?')) return;
  state.clientes = state.clientes.filter(c=>c.id!==id);
  saveState();
  render();
}

/* ==================== FLUXO DE CAIXA ==================== */
function renderFluxo(){
  const filtro = state.filtroFluxo;
  let lista = [...state.custos];
  if(filtro==='receita') lista = lista.filter(c=>c.tipo==='receita');
  if(filtro==='fixo') lista = lista.filter(c=>c.tipo==='custo' && c.natureza==='fixo');
  if(filtro==='variavel') lista = lista.filter(c=>c.tipo==='custo' && c.natureza==='variavel');
  lista.sort((a,b)=>(b.data||'').localeCompare(a.data||'') || b.id-a.id);

  const totalReceitas = state.custos.filter(c=>c.tipo==='receita').reduce((s,c)=>s+c.valor,0);
  const totalFixos = state.custos.filter(c=>c.tipo==='custo' && c.natureza==='fixo').reduce((s,c)=>s+c.valor,0);
  const totalVariaveis = state.custos.filter(c=>c.tipo==='custo' && c.natureza==='variavel').reduce((s,c)=>s+c.valor,0);
  const fluxoLiquido = totalReceitas - totalFixos - totalVariaveis;

  return `
    <div class="header">
      <div><h2>Fluxo de Caixa</h2><div class="sub">Receitas, custos fixos e custos variáveis do brechó</div></div>
      <div class="header-actions"><button class="btn btn-primary" onclick="toggleForm()">${state.showForm?'✕ Fechar':'➕ Novo lançamento'}</button></div>
    </div>
    ${state.showForm ? `
      <div class="form-card">
        <h4>Novo lançamento</h4>
        <div class="form-grid cols-3">
          <div class="fg"><label>Tipo *</label>
            <select id="fl-tipo" onchange="atualizarCamposFluxo()">
              <option value="custo">Custo</option>
              <option value="receita">Receita</option>
            </select>
          </div>
          <div class="fg" id="fl-natureza-wrap"><label>Natureza *</label>
            <select id="fl-natureza" onchange="atualizarCategoriasFluxo()">
              <option value="fixo">Fixo</option>
              <option value="variavel">Variável</option>
            </select>

/* ==================== NUVEM (sincronização entre aparelhos) ==================== */
const API = 'api.php';
const TOKEN_KEY = 'tearBrechoToken';
const SYNC_KEY = 'tearBrechoSync'; // { versao, pendente }
const CAMPOS_DADOS = ['fornecedores','marcas','produtos','clientes','movimentacoes','vendas','custos','contadorProduto'];
let nuvem = { token: null, versao: 0, pendente: false, salvando: false, online: true, ultimo: null, timer: null, pronto: false };

function lerSync(){ try{ return JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; }catch(e){ return {}; } }
function gravarSync(){ try{ localStorage.setItem(SYNC_KEY, JSON.stringify({ versao: nuvem.versao, pendente: nuvem.pendente })); }catch(e){} }
function dadosParaNuvem(){ const d = {}; CAMPOS_DADOS.forEach(k => d[k] = state[k]); return d; }
function aplicarDadosNuvem(d){
  if(!d) return;
  CAMPOS_DADOS.forEach(k => { if(d[k] !== undefined) state[k] = d[k]; });
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}
function temDadosLocais(){ return ['produtos','clientes','vendas','fornecedores','marcas','custos','movimentacoes'].some(k => Array.isArray(state[k]) && state[k].length > 0); }
function nomeAparelho(){ const u = navigator.userAgent; return /iPhone/.test(u)?'iPhone':/iPad/.test(u)?'iPad':/Android/.test(u)?'Android':/Windows/.test(u)?'Windows':/Mac/.test(u)?'Mac':'Navegador'; }

async function api(acao, body, metodo){
  const opts = { method: metodo || (body ? 'POST' : 'GET'), headers: {} };
  if(nuvem.token) opts.headers['X-Token'] = nuvem.token;
  if(body){ opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(Object.assign({ token: nuvem.token }, body)); }
  const r = await fetch(API + '?acao=' + acao + '&_=' + Date.now(), opts);
  let j = {}; try{ j = await r.json(); }catch(e){}
  return { status: r.status, ok: r.ok, json: j };
}

function statusNuvemHTML(){
  if(!nuvem.pronto) return '☁️ Conectando...';
  if(nuvem.salvando) return '⏳ Salvando na nuvem...';
  if(nuvem.pendente && !nuvem.online) return '⚠️ Sem internet — salvo neste aparelho, envia quando voltar';
  if(nuvem.pendente) return '⏳ Alterações aguardando envio...';
  const h = nuvem.ultimo ? new Date(nuvem.ultimo).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '';
  return '☁️ Salvo na nuvem' + (h ? ' · ' + h : '');
}
function atualizarStatusNuvem(){
  const el = document.getElementById('nuvem-status');
  if(el) el.innerHTML = statusNuvemHTML();
  const m = document.getElementById('nuvem-status-mobile');
  if(m) m.textContent = nuvem.salvando ? '⏳' : (nuvem.pendente ? '⚠️' : '☁️');
}

function agendarSync(){
  nuvem.pendente = true; gravarSync(); atualizarStatusNuvem();
  clearTimeout(nuvem.timer);
  nuvem.timer = setTimeout(enviarNuvem, 700);
}

async function enviarNuvem(forcar){
  if(!nuvem.token || !nuvem.pronto) return;
  if(nuvem.salvando){ clearTimeout(nuvem.timer); nuvem.timer = setTimeout(enviarNuvem, 800); return; }
  nuvem.salvando = true; atualizarStatusNuvem();
  try{
    const r = await api('salvar', { dados: dadosParaNuvem(), versaoBase: nuvem.versao, forcar: !!forcar, aparelho: nomeAparelho() });
    nuvem.online = true;
    if(r.status === 401){ nuvem.salvando = false; pedirLogin('Sua sessão expirou. Entre de novo — suas alterações estão guardadas neste aparelho.'); return; }
    if(r.status === 409){
      nuvem.salvando = false;
      const manterMinhas = confirmSafe('Outro aparelho salvou alterações no painel ao mesmo tempo.\n\nOK = manter as alterações DESTE aparelho (substitui as do outro)\nCancelar = carregar as alterações do outro aparelho');
      if(manterMinhas){ return enviarNuvem(true); }
      nuvem.versao = r.json.versao; nuvem.pendente = false; gravarSync();
      aplicarDadosNuvem(r.json.dados); render(); showToast('Dados atualizados do outro aparelho');
      return;
    }
    if(r.ok){
      nuvem.versao = r.json.versao; nuvem.ultimo = r.json.atualizadoEm; nuvem.pendente = false; gravarSync();
    }else{
      showToast('Erro ao salvar na nuvem (' + (r.json.erro || r.status) + ')');
    }
  }catch(e){
    nuvem.online = false;
    clearTimeout(nuvem.timer); nuvem.timer = setTimeout(enviarNuvem, 10000);
  }
  nuvem.salvando = false; atualizarStatusNuvem();
}

/* Busca alterações feitas em outros aparelhos */
async function verificarAtualizacoes(){
  if(!nuvem.pronto || !nuvem.token || nuvem.salvando) return;
  if(nuvem.pendente){ enviarNuvem(); return; }
  if(state.showForm) return; // não atrapalha quem está preenchendo formulário
  try{
    const r = await api('versao');
    nuvem.online = true;
    if(r.status === 401){ pedirLogin('Sua sessão expirou. Entre de novo.'); return; }
    if(r.ok && r.json.versao > nuvem.versao){
      const d = await api('dados');
      if(d.ok && !nuvem.pendente && !state.showForm){
        nuvem.versao = d.json.versao; nuvem.ultimo = d.json.atualizadoEm; gravarSync();
        aplicarDadosNuvem(d.json.dados); render();
        showToast('🔄 Painel atualizado com alterações de outro aparelho');
      }
    }
  }catch(e){ nuvem.online = false; }
  atualizarStatusNuvem();
}

/* Primeira carga: decide se usa os dados da nuvem ou envia os deste aparelho */
async function carregarDaNuvem(){
  const d = await api('dados');
  if(d.status === 401){ pedirLogin(); return; }
  if(!d.ok){ throw new Error('falha'); }
  const sync = lerSync();
  const servidorVazio = !d.json.dados || !d.json.versao;
  nuvem.pronto = true;
  if(servidorVazio){
    nuvem.versao = 0;
    if(temDadosLocais()){
      showToast('Enviando os dados deste aparelho para a nuvem...');
      await enviarNuvem(true);
      showToast('✅ Dados enviados! Agora qualquer aparelho vê o mesmo estoque');
    }
  }else if(sync.pendente && temDadosLocais() && sync.versao === d.json.versao){
    // alterações feitas offline neste aparelho, nuvem não mudou: envia
    nuvem.versao = d.json.versao; await enviarNuvem();
  }else if(sync.pendente && temDadosLocais() && sync.versao !== d.json.versao && sync.versao !== undefined){
    const manter = confirmSafe('Este aparelho tem alterações que não foram enviadas, e a nuvem também mudou.\n\nOK = enviar as alterações DESTE aparelho\nCancelar = usar os dados da nuvem');
    nuvem.versao = d.json.versao;
    if(manter){ await enviarNuvem(true); } else { aplicarDadosNuvem(d.json.dados); nuvem.pendente = false; gravarSync(); }
  }else if(!sync.versao && temDadosLocais() && JSON.stringify(dadosParaNuvem()) !== JSON.stringify(d.json.dados)){
    // aparelho que nunca sincronizou, com dados próprios, e a nuvem já tem dados
    const usarNuvem = confirmSafe('A nuvem já tem dados do painel, e este aparelho também tem dados salvos.\n\nOK = usar os dados da NUVEM (recomendado)\nCancelar = enviar os dados DESTE aparelho e substituir a nuvem');
    nuvem.versao = d.json.versao;
    if(usarNuvem){ aplicarDadosNuvem(d.json.dados); nuvem.pendente = false; gravarSync(); }
    else { await enviarNuvem(true); }
  }else{
    nuvem.versao = d.json.versao; nuvem.ultimo = d.json.atualizadoEm; nuvem.pendente = false; gravarSync();
    aplicarDadosNuvem(d.json.dados);
  }
  if(!nuvem.ultimo) nuvem.ultimo = d.json.atualizadoEm || new Date().toISOString();
  fecharLogin();
  render();
}

async function criarSenha(){
  const s = document.getElementById('login-senha').value, s2 = document.getElementById('login-senha2').value;
  if(s.length < 6) return pedirLogin('A senha precisa ter pelo menos 6 caracteres.', true);
  if(s !== s2) return pedirLogin('As senhas não são iguais.', true);
  try{
    const r = await api('criar_senha', { senha: s });
    if(!r.ok){ return pedirLogin(r.json.erro === 'ja_configurado' ? 'A senha já foi criada. Entre com ela.' : 'Erro: ' + (r.json.erro||r.status), r.json.erro !== 'ja_configurado'); }
    nuvem.token = r.json.token; try{ localStorage.setItem(TOKEN_KEY, nuvem.token); }catch(e){}
    await carregarDaNuvem();
  }catch(e){ pedirLogin('Sem conexão com o servidor. Verifique a internet.', true); }
}
async function fazerLogin(){
  const s = document.getElementById('login-senha').value;
  if(!s) return;
  try{
    const r = await api('login', { senha: s });
    if(!r.ok){ return pedirLogin(r.json.erro === 'muitas_tentativas' ? 'Muitas tentativas. Aguarde 15 minutos.' : 'Senha incorreta.'); }
    nuvem.token = r.json.token; try{ localStorage.setItem(TOKEN_KEY, nuvem.token); }catch(e){}
    await carregarDaNuvem();
  }catch(e){ pedirLogin('Sem conexão com o servidor. Verifique a internet.'); }
}
async function sairPainel(){

async function iniciarNuvem(){

/* ==================== FOTOS ==================== */
function urlFoto(nome){ return nome ? API + '?acao=foto&n=' + encodeURIComponent(nome) : ''; }
let fotosEdit = [];
let fotosEditKey = null;
let fotosEnviando = 0;

function comprimirImagem(file, maxLado, qualidade){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight;
      const escala = Math.min(1, maxLado / Math.max(w, h));
      w = Math.round(w * escala); h = Math.round(h * escala);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h); ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', qualidade));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('imagem inválida')); };
    img.src = url;
  });
}

async function adicionarFotos(inputEl){
  const files = Array.from(inputEl.files || []);
  inputEl.value = '';
  if(!files.length) return;
  if(!nuvem.online){ showToast('Sem internet: não dá para enviar fotos agora'); return; }
  for(const f of files){
    if(fotosEdit.length + fotosEnviando >= 10){ showToast('Máximo de 10 fotos por produto'); break; }
    fotosEnviando++; renderFotosEdit();
    try{
      const dataUrl = await comprimirImagem(f, 1400, 0.82);
      const r = await api('enviar_foto', { imagem: dataUrl });
      if(r.ok){ fotosEdit.push(r.json.nome); }
      else showToast('Erro ao enviar foto: ' + (r.json.erro || r.status));
    }catch(e){ showToast('Não foi possível enviar uma das fotos'); }
    fotosEnviando--; renderFotosEdit();
  }
}
function removerFotoEdit(i){ fotosEdit.splice(i,1); renderFotosEdit(); }
function capaFotoEdit(i){ const [f] = fotosEdit.splice(i,1); fotosEdit.unshift(f); renderFotosEdit(); }
function moverFotoEdit(i, d){ const j = i + d; if(j<0 || j>=fotosEdit.length) return; [fotosEdit[i], fotosEdit[j]] = [fotosEdit[j], fotosEdit[i]]; renderFotosEdit(); }
function fotosEditHTML(){
  return fotosEdit.map((n,i)=>`
    <div class="foto-thumb ${i===0?'capa':''}">
      <img src="${urlFoto(n)}" alt="">
      ${i===0?'<span class="foto-capa-tag">CAPA</span>':''}
      <div class="foto-acoes">
        ${i>0?`<button type="button" title="Mover para esquerda" onclick="moverFotoEdit(${i},-1)">◀</button>`:''}
        ${i>0?`<button type="button" title="Usar como capa" onclick="capaFotoEdit(${i})">★</button>`:''}
        ${i<fotosEdit.length-1?`<button type="button" title="Mover para direita" onclick="moverFotoEdit(${i},1)">▶</button>`:''}
        <button type="button" title="Remover" onclick="removerFotoEdit(${i})">✕</button>
      </div>
    </div>`).join('') +
    (fotosEnviando ? Array.from({length:fotosEnviando}).map(()=>`<div class="foto-thumb enviando"><span>Enviando...</span></div>`).join('') : '') +
    (fotosEdit.length + fotosEnviando < 10 ? `<label class="foto-add"><input type="file" accept="image/*" multiple onchange="adicionarFotos(this)" style="display:none;"><span>📷</span><b>Adicionar fotos</b><small>câmera ou galeria</small></label>` : '');
}
function renderFotosEdit(){ const el = document.getElementById('p-fotos'); if(el) el.innerHTML = fotosEditHTML(); const n = document.getElementById('p-fotos-n'); if(n) n.textContent = fotosEdit.length; }

/* ==================== HELPERS DE PRODUTO / CATÁLOGO ==================== */
const STATUS_MANUAL = ['', 'Reservado', 'Inativo'];
function statusProduto(p){
  if(p.status === 'Inativo') return { txt:'Inativo', cls:'b-gray' };
  if((p.estoque||0) <= 0) return { txt:'Vendido', cls:'b-red' };
  if(p.status === 'Reservado') return { txt:'Reservado', cls:'b-orange' };
  return { txt:'Disponível', cls:'b-green' };
}
function precoAtual(p){ return (p.precoPromo && p.precoPromo > 0 && p.precoPromo < p.precoVenda) ? p.precoPromo : p.precoVenda; }
function capaProduto(p){ return (p.fotos && p.fotos.length) ? urlFoto(p.fotos[0]) : ''; }
function nomeMarca(p){ const m = p.marcaId ? state.marcas.find(x=>x.id==p.marcaId) : null; return m ? m.nome : ''; }
function semAcento(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,''); }
function sigla(s, n){ const t = semAcento(s).toUpperCase().replace(/[^A-Z0-9]/g,''); return t.slice(0, n) || 'X'.repeat(n); }
function gerarSku(dados, codigo){
  const cat = dados.categoria ? sigla(dados.categoria, 3) : 'GER';
  const mar = dados.marcaNome ? sigla(dados.marcaNome, 3) : 'SM';
  const tam = dados.variacoes ? sigla(dados.variacoes.split(/[ ,\/]/)[0], 3) : 'U';
  const num = String(codigo||'').replace(/\D/g,'') || String(state.contadorProduto).padStart(4,'0');
  let sku = `TEAR-${cat}-${mar}-${tam}-${num}`;
  return sku;
}
function preencherSkuAuto(){
  const marca = findMarcaByLabel(val('p-marca-busca'));
  const editing = state.editId ? state.produtos.find(p=>p.id===state.editId) : null;
  const codigo = editing ? editing.codigo : ('P' + String(state.contadorProduto).padStart(4,'0'));
  document.getElementById('p-sku').value = gerarSku({ categoria: val('p-categoria'), marcaNome: marca ? marca.nome : val('p-marca-busca'), variacoes: val('p-variacoes') }, codigo);
}
function medidasTexto(p){
  const m = p.medidas || {};
  const partes = [];
  if(m.busto) partes.push('Busto ' + m.busto + ' cm');
  if(m.cintura) partes.push('Cintura ' + m.cintura + ' cm');
  if(m.quadril) partes.push('Quadril ' + m.quadril + ' cm');
  if(m.ombro) partes.push('Ombro ' + m.ombro + ' cm');
  if(m.manga) partes.push('Manga ' + m.manga + ' cm');
  if(m.comprimento) partes.push('Comprimento ' + m.comprimento + ' cm');
  return partes.join(' · ');
}
function textoAnuncio(p){
  const marca = nomeMarca(p);
  const linhas = [];
  linhas.push('✨ ' + p.nome.toUpperCase());
  if(marca) linhas.push('🏷️ Marca: ' + marca);
  if(p.variacoes) linhas.push('📏 Tamanho: ' + p.variacoes);
  const med = medidasTexto(p); if(med) linhas.push('📐 Medidas: ' + med);
  if(p.cor) linhas.push('🎨 Cor: ' + p.cor);
  if(p.material) linhas.push('🧵 Tecido: ' + p.material);
  if(p.epoca) linhas.push('🕰️ Estilo/época: ' + p.epoca);
  if(p.estado) linhas.push('⭐ Estado: ' + p.estado);
  if(p.descricao){ linhas.push(''); linhas.push(p.descricao); }
  linhas.push('');
  if(p.precoPromo && p.precoPromo > 0 && p.precoPromo < p.precoVenda) linhas.push('💰 De ' + fmt(p.precoVenda) + ' por ' + fmt(p.precoPromo));
  else linhas.push('💰 ' + fmt(p.precoVenda));
  linhas.push('🔖 Cód: ' + (p.sku || p.codigo));
  linhas.push('');
  linhas.push('📲 Peça única! Chama no direct ou WhatsApp para garantir a sua.');
  return linhas.join('\n');
}
function copiarTexto(txt){
  const ok = () => showToast('Texto copiado! É só colar no Instagram/WhatsApp');
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(ok).catch(()=>copiarFallback(txt, ok)); }
  else copiarFallback(txt, ok);
}
function copiarFallback(txt, ok){
  const ta = document.createElement('textarea'); ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); ok(); }catch(e){ showToast('Não foi possível copiar'); } document.body.removeChild(ta);
}
function gerarSkusFaltantes(){
  const sem = state.produtos.filter(p=>!p.sku);
  if(!sem.length) return;
  if(!confirmSafe('Gerar SKU automático para '+sem.length+' produto(s) sem SKU?')) return;
  const usados = new Set(state.produtos.filter(p=>p.sku).map(p=>p.sku.toLowerCase()));
  sem.forEach(p=>{ let sku = gerarSku({ categoria:p.categoria, marcaNome:nomeMarca(p), variacoes:p.variacoes }, p.codigo); let k=2; const base=sku; while(usados.has(sku.toLowerCase())) sku = base+'-'+(k++); usados.add(sku.toLowerCase()); p.sku = sku; });
  saveState(); render(); showToast('SKUs gerados');
}
function copiarAnuncio(id){ const p = state.produtos.find(x=>x.id===id); if(p) copiarTexto(textoAnuncio(p)); }

/* ==================== CATÁLOGO (vitrine com fotos) ==================== */
function filtrarCatalogo(){
  const f = state.catFiltro || {};
  const busca = semAcento((f.busca||'').toLowerCase());
  let lista = state.produtos.filter(p => {
    const st = statusProduto(p).txt;
    if(f.status === 'disponiveis' && st !== 'Disponível') return false;
    if(f.status === 'reservados' && st !== 'Reservado') return false;
    if(f.status === 'vendidos' && st !== 'Vendido') return false;
    if(f.status === 'inativos' && st !== 'Inativo') return false;
    if(f.status === 'semfoto' && p.fotos && p.fotos.length) return false;
    if(f.status === 'poucasfotos' && ((p.fotos||[]).length >= 3 || statusProduto(p).txt !== 'Disponível')) return false;
    if(f.status === 'semdescricao' && ((p.descricao||'').trim() || statusProduto(p).txt !== 'Disponível')) return false;
    if(f.categoria && p.categoria !== f.categoria) return false;
    if(f.marca && String(p.marcaId) !== String(f.marca)) return false;
    if(f.tamanho && semAcento((p.variacoes||'').toLowerCase()).indexOf(semAcento(f.tamanho.toLowerCase())) < 0) return false;
    if(busca){
      const alvo = semAcento([p.nome, p.codigo, p.sku, p.categoria, nomeMarca(p), p.cor, p.material, p.epoca, p.descricao, p.tags, p.variacoes].join(' ').toLowerCase());
      if(alvo.indexOf(busca) < 0) return false;
    }
    return true;
  });
  const ord = f.ordem || 'recentes';
  if(ord === 'menor') lista.sort((a,b)=>precoAtual(a)-precoAtual(b));
  else if(ord === 'maior') lista.sort((a,b)=>precoAtual(b)-precoAtual(a));
  else if(ord === 'nome') lista.sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
  else lista.sort((a,b)=>(b.dataEntrada||'').localeCompare(a.dataEntrada||'') || (b.id - a.id));
  return lista;
}
function setCatFiltro(k, v){ state.catFiltro = Object.assign({}, state.catFiltro, { [k]: v }); render(); }

function renderCatalogo(){
  if(!state.catFiltro) state.catFiltro = { status:'disponiveis', ordem:'recentes' };
  const f = state.catFiltro;
  const lista = filtrarCatalogo();

  const semDesc = state.produtos.filter(p => !(p.descricao||'').trim() && statusProduto(p).txt === 'Disponível').length;
  const disp = state.produtos.filter(p => statusProduto(p).txt === 'Disponível');
  const valorVitrine = disp.reduce((s,p)=>s + precoAtual(p) * (p.estoque||0), 0);
  const marcasUsadas = state.marcas.filter(m => state.produtos.some(p => p.marcaId == m.id));
  return `
    <div class="header">
      <div><h2>Catálogo</h2><div class="sub">${disp.length} peça(s) disponível(is) · vitrine de ${fmt(valorVitrine)}</div></div>
      <div class="header-actions">
        <button class="btn btn-outline" onclick="imprimirCatalogo()">🖨️ Catálogo PDF</button>
        <button class="btn btn-outline" onclick="imprimirEtiquetas()">🏷️ Etiquetas</button>
        <button class="btn btn-primary" onclick="novoProdutoDoCatalogo()">➕ Nova peça</button>
      </div>
    </div>
    ${semFoto || semDesc ? `<div class="alert-box">🤖 Para o robô do WhatsApp: ${semFoto ? `<b>${semFoto} peça(s) com menos de 3 fotos</b> (<a href="#" onclick="setCatFiltro('status','poucasfotos');return false;">ver</a>)` : ''}${semFoto && semDesc ? ' · ' : ''}${semDesc ? `<b>${semDesc} sem descrição</b> (<a href="#" onclick="setCatFiltro('status','semdescricao');return false;">ver</a>)` : ''}</div>` : ''}
    <div class="panel">
      <div class="toolbar cat-toolbar">
        <input type="text" id="busca-catalogo" placeholder="🔍 Buscar nome, SKU, marca, cor, tecido..." value="${esc(f.busca||'')}" oninput="state.catFiltro.busca=this.value; render();">
        <select onchange="setCatFiltro('status', this.value)">
          <option value="disponiveis" ${f.status==='disponiveis'?'selected':''}>Disponíveis</option>
          <option value="" ${!f.status?'selected':''}>Todos</option>
          <option value="reservados" ${f.status==='reservados'?'selected':''}>Reservados</option>
          <option value="vendidos" ${f.status==='vendidos'?'selected':''}>Vendidos</option>
          <option value="inativos" ${f.status==='inativos'?'selected':''}>Inativos</option>
          <option value="semfoto" ${f.status==='semfoto'?'selected':''}>Sem foto</option>
          <option value="poucasfotos" ${f.status==='poucasfotos'?'selected':''}>Menos de 3 fotos</option>
          <option value="semdescricao" ${f.status==='semdescricao'?'selected':''}>Sem descrição</option>
        </select>
        <select onchange="setCatFiltro('categoria', this.value)">
          <option value="">Todas categorias</option>
          ${CATEGORIAS_PRODUTO.map(c=>`<option ${f.categoria===c?'selected':''}>${c}</option>`).join('')}
        </select>
        <select onchange="setCatFiltro('marca', this.value)">
          <option value="">Todas marcas</option>
          ${marcasUsadas.map(m=>`<option value="${m.id}" ${String(f.marca)===String(m.id)?'selected':''}>${esc(m.nome)}</option>`).join('')}
        </select>
        <input type="text" class="cat-tam" placeholder="Tam." value="${esc(f.tamanho||'')}" onchange="setCatFiltro('tamanho', this.value)">
        <select onchange="setCatFiltro('ordem', this.value)">
          <option value="recentes" ${f.ordem==='recentes'?'selected':''}>Mais recentes</option>
          <option value="menor" ${f.ordem==='menor'?'selected':''}>Menor preço</option>
          <option value="maior" ${f.ordem==='maior'?'selected':''}>Maior preço</option>
          <option value="nome" ${f.ordem==='nome'?'selected':''}>Nome A-Z</option>
        </select>
      </div>
      <div class="cat-count">${lista.length} resultado(s)</div>
      ${lista.length === 0 ? `<div class="empty">${state.produtos.length ? 'Nenhuma peça encontrada com esses filtros' : 'Nenhuma peça cadastrada ainda. Clique em “Nova peça”.'}</div>` : `
      <div class="cat-grid">
        ${lista.map(p => {
          const st = statusProduto(p);
          const capa = capaProduto(p);
          const marca = nomeMarca(p);
          const promo = p.precoPromo && p.precoPromo > 0 && p.precoPromo < p.precoVenda;
          return `
          <div class="cat-card" onclick="abrirProduto(${p.id})">
            <div class="cat-foto">
              ${capa ? `<img src="${capa}" loading="lazy" alt="${esc(p.nome)}">` : `<div class="cat-semfoto">📷<span>Sem foto</span></div>`}
              <span class="badge ${st.cls} cat-status">${st.txt}</span>
              ${p.fotos && p.fotos.length ? `<span class="cat-nfotos" style="${p.fotos.length<3?'background:#e8590c;':''}">🖼️ ${p.fotos.length}</span>` : ''}
              ${p.publicadoWhatsappEm ? `<span class="cat-nfotos" style="left:8px;right:auto;background:#2f9e44;">✓ WhatsApp</span>` : ''}
              ${promo ? `<span class="cat-promo">-${Math.round((1 - p.precoPromo/p.precoVenda)*100)}%</span>` : ''}
            </div>
            <div class="cat-info">
              ${marca ? `<div class="cat-marca">${esc(marca)}</div>` : ''}
              <div class="cat-nome">${esc(p.nome)}</div>
              <div class="cat-meta">${[p.variacoes ? 'Tam. '+esc(p.variacoes) : '', esc(p.cor||'')].filter(Boolean).join(' · ')}</div>
              <div class="cat-preco">${promo ? `<s>${fmt(p.precoVenda)}</s> ` : ''}<b>${fmt(precoAtual(p))}</b></div>
              <div class="cat-sku">${esc(p.sku || p.codigo)}</div>
            </div>
          </div>`;
        }).join('')}
      </div>`}
    </div>
  `;
}

/* ---------- Detalhe do produto (modal) ---------- */

  const fotos = p.fotos || [];

  const lucro = precoAtual(p) - (p.precoCusto||0);
  const el = document.getElementById('modal');
  el.innerHTML = `
    <div class="modal-box" onclick="event.stopPropagation()">

          ${fotos.length ? `<a class="btn btn-gray btn-sm" style="display:inline-block;margin-top:8px;text-decoration:none;" href="${urlFoto(fotos[i])}" download="${esc((p.sku||p.codigo)+'-'+(i+1))}.jpg" target="_blank">⬇️ Baixar foto</a>` : ''}

            <tr><th>Código</th><td>${esc(p.codigo)}</td></tr>

            ${p.variacoes?`<tr><th>Tamanho</th><td>${esc(p.variacoes)}</td></tr>`:''}
            ${med?`<tr><th>Medidas</th><td>${esc(med)}</td></tr>`:''}
            ${p.cor?`<tr><th>Cor</th><td>${esc(p.cor)}</td></tr>`:''}
            ${p.material?`<tr><th>Tecido</th><td>${esc(p.material)}</td></tr>`:''}
            ${p.epoca?`<tr><th>Estilo/época</th><td>${esc(p.epoca)}</td></tr>`:''}
            ${p.estado?`<tr><th>Estado</th><td>${esc(p.estado)}</td></tr>`:''}

function fecharModal(){ const el = document.getElementById('modal'); el.classList.remove('show'); el.innerHTML=''; document.body.classList.remove('modal-aberto'); }
document.addEventListener('keydown', e => { if(e.key === 'Escape') fecharModal(); });
function mudarStatus(id, status){
  const p = state.produtos.find(x=>x.id===id); if(!p) return;
  p.status = status; saveState(); render(); abrirProduto(id);
  showToast(status === 'Reservado' ? 'Peça reservada' : 'Reserva removida');
}
function venderDoModal(id){
  const p = state.produtos.find(x=>x.id===id); if(!p) return;
  fecharModal();
  state.section = 'vendas'; state.showForm = true; state.editId = null;
  const pr = precoAtual(p);
  state.vendaCart = [{ produtoId: p.id, produtoNome: p.nome, quantidade: 1, precoUnit: pr, subtotal: Math.round(pr*100)/100 }];
  render();
  showToast('Peça adicionada à venda — confira e finalize');
}

  w.document.write(`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><base href="${base}"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${titulo}</title><style>
    *{box-sizing:border-box;} body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#292524;margin:0;padding:18px;}

    .imp-btn{position:fixed;right:16px;bottom:16px;padding:12px 20px;background:#87341c;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;}
    @media print{.imp-btn{display:none;} body{padding:0;}}
    ${css}
  </style></head><body>${corpoHtml}<button class="imp-btn" onclick="window.print()">🖨️ Imprimir / Salvar PDF</button>
  <script>window.onload=function(){setTimeout(function(){window.print();},600);};<\/script></body></html>`);
  w.document.close();
}

    .item{border:1px solid #eee2d2;border-radius:10px;overflow:hidden;break-inside:avoid;page-break-inside:avoid;}
    .ft{aspect-ratio:3/4;background:#f3f1ec;} .ft img{width:100%;height:100%;object-fit:cover;display:block;}
    .sf{display:flex;align-items:center;justify-content:center;height:100%;color:#a8a29e;font-size:12px;}
    .tx{padding:8px 10px;} .mc{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#87341c;font-weight:700;}
    .nm{font-weight:700;font-size:13px;margin:2px 0;} .mt{font-size:11px;color:#78716c;}
    .pr{font-size:15px;font-weight:800;margin-top:4px;} .pr s{font-weight:400;color:#a8a29e;font-size:12px;} .sk{font-size:10px;color:#a8a29e;}
    @media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr);}}
  `);
}
function imprimirEtiquetas(){
  const lista = filtrarCatalogo();
  if(!lista.length){ showToast('Nenhuma peça na lista atual'); return; }
  const corpo = `<div class="topo"><h1>Etiquetas</h1><span>${lista.length} etiqueta(s) · use os filtros do catálogo para escolher quais</span></div>
    <div class="etqs">${lista.map(p=>{ const marca = nomeMarca(p); return `<div class="etq">
      <div class="lj">TEAR BRECHÓ</div>
      <div class="nm">${esc(p.nome)}</div>
      <div class="mt">${[marca?esc(marca):'', p.variacoes?'Tam. '+esc(p.variacoes):''].filter(Boolean).join(' · ')}</div>
      <div class="pr">${fmt(precoAtual(p))}</div>
      <div class="sk">${esc(p.sku||p.codigo)}</div></div>`; }).join('')}</div>`;
  abrirJanelaImpressao('Etiquetas Tear Brechó', corpo, `
    .etqs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
    .etq{border:1px dashed #a8a29e;border-radius:6px;padding:8px;text-align:center;break-inside:avoid;page-break-inside:avoid;}
    .lj{font-size:9px;letter-spacing:2px;color:#87341c;font-weight:800;} .nm{font-size:11px;font-weight:700;margin:3px 0;line-height:1.2;}
    .mt{font-size:9.5px;color:#57534e;} .pr{font-size:17px;font-weight:900;margin:3px 0;} .sk{font-size:9px;font-family:monospace;}
    @media(max-width:600px){.etqs{grid-template-columns:repeat(2,1fr);}}
  `);
}

/* ==================== INIT ==================== */
render();
iniciarNuvem();
</script>
