<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#87341c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tear Painel">
<title>Painel Tear Brechó</title>
<style>
:root{
  --pri:#87341c; --pri-2:#a44a2c; --pri-soft:#f6e8e1; --pri-ink:#5c2110;
  --bg:#f6f3ee; --card:#fff; --ink:#24201d; --ink-2:#57534e; --mute:#8f8984; --line:#ebe5dc; --line-2:#f3efe8;
  --ok:#2f9e44; --ok-soft:#e6f6ea; --warn:#e8590c; --warn-soft:#fff2e6; --bad:#e03131; --bad-soft:#fdecec; --blue:#1971c2;
  --r:14px; --sh:0 1px 2px rgba(36,32,29,.05), 0 4px 14px rgba(36,32,29,.04);
  color-scheme: light;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;}
a.link{color:var(--pri);cursor:pointer;font-weight:600;text-decoration:none;}
.hidden{display:none!important;}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}

/* ===== layout ===== */
.container{display:flex;min-height:100vh;}
.sidebar{width:240px;background:#fff;border-right:1px solid var(--line);padding:18px 14px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;}
.brand img{width:40px;height:auto;border-radius:8px;display:block;}
.brand-text h1{font-size:17px;margin:0;font-weight:800;color:var(--pri);letter-spacing:-.2px;}
.brand-text span{font-size:11px;color:var(--mute);}
.nav-menu{display:flex;flex-direction:column;gap:2px;}
.nav-btn{width:100%;text-align:left;padding:10px 12px;border:none;background:transparent;color:var(--ink-2);cursor:pointer;border-radius:10px;font-size:14px;display:flex;align-items:center;gap:10px;font-weight:500;}
.nav-btn:hover{background:var(--line-2);}
.nav-btn.active{background:var(--pri-soft);color:var(--pri-ink);font-weight:700;}
.nav-ic{width:22px;text-align:center;}
.side-new{margin:6px 0 14px;width:100%;}
.nuvem-box{margin-top:auto;padding:12px;background:var(--line-2);border-radius:12px;font-size:12px;color:var(--ink-2);}
.content{flex:1;min-width:0;padding:26px 32px 60px;max-width:1440px;}
.topbar{display:none;}
#tabbar{display:none;}

/* ===== tipografia / header ===== */
.header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;flex-wrap:wrap;gap:12px;}
.header h2{font-size:26px;font-weight:800;margin:0;letter-spacing:-.4px;}
.header .sub{font-size:13px;color:var(--mute);margin-top:3px;}
.header-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.voltar{display:inline-block;font-size:13px;color:var(--pri);cursor:pointer;margin-bottom:4px;font-weight:600;}
.hint{font-size:11.5px;color:var(--mute);font-weight:400;}
.warn-t{color:var(--warn);}

/* ===== botões ===== */
.btn{padding:10px 16px;border:1px solid transparent;border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:600;font-family:inherit;transition:filter .15s,background .15s;line-height:1.2;white-space:nowrap;}
.btn:hover{filter:brightness(.95);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-primary{background:var(--pri);color:#fff;}
.btn-success{background:var(--ok);color:#fff;}
.btn-danger{background:var(--bad);color:#fff;}
.btn-gray{background:#efebe4;color:var(--ink-2);}
.btn-outline{background:#fff;color:var(--pri);border-color:#e3d3c9;}
.btn-danger-outline{background:#fff;color:var(--bad);border-color:#f3c9c9;}
.btn-whats{background:#25d366;color:#fff;width:100%;}
.btn-insta{background:linear-gradient(90deg,#f58529,#dd2a7b,#8134af);color:#fff;width:100%;}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:8px;}
.btn-icon{background:transparent;border:none;cursor:pointer;font-size:15px;padding:5px 7px;border-radius:7px;}
.btn-icon:hover{background:var(--line-2);}
.menu-wrap{position:relative;}
.menu{display:none;position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.12);min-width:260px;z-index:60;padding:6px;}
.menu.open{display:block;}
.menu button{display:block;width:100%;text-align:left;padding:10px 12px;border:none;background:none;font-size:13.5px;border-radius:8px;cursor:pointer;font-family:inherit;color:var(--ink);}
.menu button:hover{background:var(--line-2);}

/* ===== cards / painéis ===== */
.panel{background:var(--card);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--sh);overflow:hidden;margin-bottom:18px;}
.panel-title{padding:14px 18px;border-bottom:1px solid var(--line-2);font-weight:700;font-size:14.5px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.pad{padding:14px 18px;}
.card{background:#fff;padding:18px 20px;border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--sh);}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:16px;}
.two-col{display:grid;grid-template-columns:1.3fr .7fr;gap:18px;align-items:start;}
.stat{display:flex;justify-content:space-between;align-items:flex-start;}
.stat-txt p:first-child{color:var(--mute);font-size:12px;margin:0 0 6px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;}
.stat-txt p:last-child{font-size:22px;font-weight:800;margin:0;}
.stat-icon{font-size:24px;opacity:.85;}
.stat.warn .stat-txt p:last-child{color:var(--warn);} .stat.good .stat-txt p:last-child{color:var(--ok);} .stat.bad .stat-txt p:last-child{color:var(--bad);}
.card h3{margin:0 0 4px;font-size:15px;} .card .value{font-size:26px;font-weight:800;margin:6px 0 2px;} .card .desc{font-size:12px;color:var(--mute);margin:0;}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px;}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:3px;}
.kpi span{font-size:11.5px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.3px;}
.kpi b{font-size:22px;font-weight:800;letter-spacing:-.3px;}
.kpi b.pos{color:var(--ok);} .kpi b.neg{color:var(--bad);}
.kpi small{font-size:11.5px;color:var(--mute);}
.kpi.destaque{background:linear-gradient(135deg,var(--pri),var(--pri-2));border:none;color:#fff;}
.kpi.destaque span,.kpi.destaque small{color:rgba(255,255,255,.8);}
.tarefas{display:flex;flex-direction:column;}
.tarefa{display:flex;align-items:center;gap:12px;padding:13px 18px;border:none;border-bottom:1px solid var(--line-2);background:#fff;text-align:left;font-size:13.5px;cursor:pointer;font-family:inherit;color:var(--ink);}
.tarefa:last-child{border-bottom:none;} .tarefa:hover{background:#fcfaf7;}
.tarefa span{font-size:18px;} .tarefa em{margin-left:auto;font-style:normal;color:var(--mute);font-size:18px;}
.chart30{display:flex;align-items:flex-end;gap:3px;height:130px;padding:16px 18px 4px;}
.c30{flex:1;height:100%;display:flex;align-items:flex-end;}
.c30 i{display:block;width:100%;background:var(--pri);border-radius:4px 4px 0 0;opacity:.85;}
.c30 i.zero{background:var(--line);}
.chart30-leg{display:flex;justify-content:space-between;padding:0 18px 12px;font-size:11px;color:var(--mute);}
.hbar{display:grid;grid-template-columns:100px 1fr auto;gap:10px;align-items:center;font-size:12.5px;margin-bottom:8px;}
.hbar-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2);}
.hbar-t{height:8px;background:var(--line-2);border-radius:5px;overflow:hidden;} .hbar-t i{display:block;height:100%;background:var(--pri);border-radius:5px;}
.strip{display:flex;gap:12px;overflow-x:auto;padding:14px 18px;scrollbar-width:thin;}
.strip-it{flex:0 0 120px;cursor:pointer;font-size:12px;}
.strip-it img,.strip-sf{width:120px;height:150px;object-fit:cover;border-radius:10px;background:var(--line-2);display:flex;align-items:center;justify-content:center;font-size:24px;}
.strip-it b{display:block;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;} .strip-it span{color:var(--pri);font-weight:700;}

/* ===== formulários ===== */
.form-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:18px;box-shadow:var(--sh);}
.form-card h4{margin:0 0 12px;font-size:14px;color:var(--pri);}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.form-grid.cols-3{grid-template-columns:repeat(3,1fr);}
.fg{display:flex;flex-direction:column;gap:5px;min-width:0;}
.fg.full{grid-column:1/-1;}
.fg label{font-size:12px;font-weight:600;color:var(--ink-2);}
.fg input,.fg select,.fg textarea,.busca-bar input,.filtros-ext select,.filtros-ext input{padding:10px 12px;border:1px solid #ddd5c9;border-radius:10px;font-family:inherit;font-size:14px;background:#fff;color:var(--ink);width:100%;}
.fg textarea{resize:vertical;min-height:90px;}
.fg input:focus,.fg select:focus,.fg textarea:focus,.busca-bar input:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft);}
.form-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center;}
.form-peca{max-width:980px;}
.fsec{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--sh);}
.fsec h4{margin:0 0 14px;font-size:15px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;}
.medidas-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
.med{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--mute);}
.med input{padding:9px 10px;border:1px solid #ddd5c9;border-radius:9px;font-size:14px;width:100%;}
.sku-row{display:flex;gap:6px;} .sku-row input{flex:1;min-width:0;}
.margem-box{margin-top:12px;font-size:13px;color:var(--ink-2);background:var(--line-2);padding:10px 12px;border-radius:10px;}
.margem-box:empty{display:none;}
.canais{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.canal{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;}
.canal input{width:18px;height:18px;margin-top:2px;accent-color:var(--pri);}
.canal span{font-weight:600;font-size:13.5px;} .canal small{display:block;font-weight:400;color:var(--mute);font-size:11.5px;}
.savebar{position:sticky;bottom:0;display:flex;gap:8px;align-items:center;background:rgba(246,243,238,.95);backdrop-filter:blur(6px);padding:12px 0;border-top:1px solid var(--line);margin-top:6px;flex-wrap:wrap;z-index:20;}

/* fotos */
.fotos-wrap{display:flex;gap:10px;flex-wrap:wrap;}
.foto-thumb{position:relative;width:116px;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--line-2);border:2px solid transparent;}
.foto-thumb.capa{border-color:var(--pri);}
.foto-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.foto-thumb.enviando{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mute);animation:pulsar 1s infinite alternate;}
@keyframes pulsar{from{opacity:.5}to{opacity:1}}
.foto-capa-tag{position:absolute;top:6px;left:6px;background:var(--pri);color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:5px;}
.foto-acoes{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:3px;padding:5px;background:linear-gradient(transparent,rgba(0,0,0,.55));}
.foto-acoes button{background:rgba(255,255,255,.95);border:none;border-radius:6px;width:26px;height:26px;font-size:12px;cursor:pointer;padding:0;}
.foto-add{width:116px;aspect-ratio:3/4;border:2px dashed #d5c8b8;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--pri);background:#fdfbf8;text-align:center;gap:2px;}
.foto-add span{font-size:26px;} .foto-add b{font-size:12px;} .foto-add small{font-size:10px;color:var(--mute);}

/* ===== peças ===== */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 14px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink-2);display:flex;gap:6px;align-items:center;}
.chip b{background:var(--line-2);border-radius:10px;padding:1px 7px;font-size:11.5px;}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink);} .chip.on b{background:rgba(255,255,255,.2);}
.busca-bar{display:flex;gap:8px;margin-bottom:10px;align-items:center;}
.busca-bar input{flex:1;font-size:14.5px;}
.visao{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;}
.visao button{border:none;background:none;padding:9px 12px;cursor:pointer;font-size:15px;color:var(--mute);}
.visao button.on{background:var(--line-2);color:var(--ink);}
.filtros-ext{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:8px;margin-bottom:12px;}
.selbar{position:sticky;top:0;z-index:30;display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--ink);color:#fff;padding:10px 14px;border-radius:12px;margin-bottom:12px;}
.selbar b{margin-right:6px;}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:14px;margin-bottom:20px;}
.cat-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:var(--sh);}
.cat-card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.08);}
.cat-card.sel{outline:3px solid var(--pri);}
.cat-foto{position:relative;aspect-ratio:3/4;background:var(--line-2);}
.cat-foto img{width:100%;height:100%;object-fit:cover;display:block;}
.cat-semfoto{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px;color:#cbbfb0;gap:6px;}
.cat-semfoto span{font-size:12px;}
.cat-semfoto.grande{min-height:320px;}
.cat-status{position:absolute;top:8px;left:8px;}
.cat-promo{position:absolute;top:8px;right:8px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;padding:3px 7px;border-radius:7px;}
.cat-icons{position:absolute;bottom:8px;right:8px;display:flex;gap:4px;}
.cat-icons span{background:rgba(0,0,0,.55);color:#fff;font-size:10.5px;padding:2px 7px;border-radius:10px;}
.cat-icons span.warn{background:var(--warn);}
.chk{position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid var(--pri);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;}
.cat-card.sel .chk{background:var(--pri);}
.chk-mini{display:inline-flex;width:20px;height:20px;border-radius:6px;border:2px solid var(--pri);align-items:center;justify-content:center;font-size:12px;color:var(--pri);font-weight:800;}
.cat-info{padding:10px 12px 12px;}
.cat-marca{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--pri);font-weight:800;}
.cat-nome{font-weight:700;font-size:13.5px;margin:2px 0 3px;line-height:1.25;}
.cat-meta{font-size:12px;color:var(--mute);min-height:15px;}
.cat-preco{margin-top:6px;font-size:16px;} .cat-preco s{color:var(--mute);font-size:12px;}
.cat-sku{font-size:10.5px;color:var(--mute);margin-top:2px;font-family:ui-monospace,monospace;}
.cat-sku .parada{color:var(--warn);font-weight:700;}
.cat-pend{font-size:11px;color:var(--warn);margin-top:5px;font-weight:600;}
.vazio{text-align:center;padding:50px 20px;color:var(--mute);background:#fff;border:1px dashed var(--line);border-radius:var(--r);}
.vazio div{font-size:40px;} .vazio b{display:block;color:var(--ink);font-size:16px;margin:6px 0;}
tr.clicavel{cursor:pointer;} tr.sel{background:var(--pri-soft)!important;}
.tabs{display:flex;gap:6px;margin-bottom:16px;background:#fff;border:1px solid var(--line);padding:5px;border-radius:12px;width:fit-content;}
.tabs button{border:none;background:none;padding:9px 16px;border-radius:8px;cursor:pointer;font-size:13.5px;font-family:inherit;color:var(--ink-2);font-weight:600;}
.tabs button.on{background:var(--pri-soft);color:var(--pri-ink);}

/* ===== tabelas ===== */
.toolbar{display:flex;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-2);flex-wrap:wrap;align-items:center;}
.toolbar input[type=text]{padding:9px 12px;border:1px solid #ddd5c9;border-radius:10px;font-size:13.5px;flex:1;min-width:180px;font-family:inherit;}
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead{background:#faf8f4;}
th{padding:10px 14px;text-align:left;font-weight:600;color:var(--ink-2);font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:11px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle;}
tbody tr:hover{background:#fcfaf7;}
tbody tr.low-stock{background:#fff8f3;}
.thumb-mini{width:44px;height:56px;border-radius:8px;object-fit:cover;display:block;background:var(--line-2);}
.thumb-vazio{width:44px;height:56px;border-radius:8px;background:var(--line-2);display:flex;align-items:center;justify-content:center;font-size:16px;opacity:.6;}
.empty{text-align:center;color:var(--mute);padding:30px;font-size:13px;}
.empty-inline{color:var(--mute);font-size:12.5px;padding:8px 0;}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:700;color:#fff;letter-spacing:.2px;white-space:nowrap;}
.b-green{background:var(--ok);} .b-red{background:#8f8984;} .b-orange{background:var(--warn);} .b-gray{background:#b5aea6;} .b-blue{background:var(--blue);}
.pill{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;background:var(--line-2);color:var(--ink-2);}
.tag-fixo{background:#e7f5ff;color:var(--blue);} .tag-variavel{background:var(--warn-soft);color:var(--warn);}
.money-pos{color:var(--ok);font-weight:700;} .money-neg{color:var(--bad);font-weight:700;}
.alert-box{background:var(--warn-soft);border:1px solid #ffd8a8;border-radius:12px;padding:11px 14px;margin-bottom:14px;font-size:13px;color:#7a4a03;}
.mini-list{list-style:none;margin:0;padding:0;}
.mini-list li{padding:8px 0;border-bottom:1px solid var(--line-2);font-size:12.5px;display:flex;justify-content:space-between;}
.mini-list li:last-child{border-bottom:none;}
.toast{position:fixed;top:18px;left:50%;transform:translate(-50%,-10px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:3000;opacity:0;transition:all .2s;pointer-events:none;max-width:92vw;text-align:center;}
.toast.show{opacity:1;transform:translate(-50%,0);}

/* ===== modal peça ===== */
#modal{position:fixed;inset:0;background:rgba(36,32,29,.5);display:none;align-items:flex-start;justify-content:center;z-index:1500;padding:28px 16px;overflow-y:auto;}
#modal.show{display:flex;}
body.modal-aberto{overflow:hidden;}
.modal-box{background:#fff;border-radius:18px;max-width:980px;width:100%;position:relative;padding:16px 20px 22px;}
.modal-top{display:flex;gap:10px;align-items:center;margin-bottom:14px;}
.modal-x{border:none;background:var(--line-2);width:36px;height:36px;border-radius:50%;font-size:15px;cursor:pointer;flex-shrink:0;}
.modal-grid{display:grid;grid-template-columns:1fr 1.05fr;gap:24px;}
.modal-galeria{position:sticky;top:0;align-self:start;}
.modal-foto-principal{position:relative;border-radius:14px;overflow:hidden;background:var(--line-2);aspect-ratio:3/4;}
.modal-foto-principal img{width:100%;height:100%;object-fit:cover;display:block;}
.gal-nav{position:absolute;top:50%;transform:translateY(-50%);border:none;background:rgba(255,255,255,.92);width:38px;height:38px;border-radius:50%;font-size:22px;cursor:pointer;}
.gal-nav.esq{left:8px;} .gal-nav.dir{right:8px;}
.gal-n{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:2px 9px;border-radius:10px;}
.modal-thumbs{display:flex;gap:6px;margin-top:8px;overflow-x:auto;}
.modal-thumbs img{width:56px;height:70px;object-fit:cover;border-radius:8px;cursor:pointer;opacity:.55;border:2px solid transparent;}
.modal-thumbs img.ativa{opacity:1;border-color:var(--pri);}
.modal-nome{margin:3px 0 4px;font-size:22px;letter-spacing:-.3px;}
.modal-preco{font-size:26px;font-weight:800;margin-bottom:12px;} .modal-preco s{font-size:15px;color:var(--mute);font-weight:400;}
.acoes-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px;}
.acao{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 4px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--ink);}
.acao span{font-size:20px;} .acao:hover{background:var(--line-2);}
.ajuste-box{background:var(--line-2);border-radius:12px;padding:12px;margin-bottom:10px;}
.divulgar{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;margin-bottom:12px;background:#fdfbf8;}
.divulgar-t{font-weight:700;font-size:14px;}
.divulgar-mini{display:flex;gap:6px;flex-wrap:wrap;}
.divulgar-mini button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;font-size:12px;cursor:pointer;font-family:inherit;}
.det{border-top:1px solid var(--line-2);padding-top:10px;margin-top:6px;}
.det summary{cursor:pointer;font-weight:700;font-size:13.5px;padding:4px 0 8px;}
.modal-ficha{font-size:13px;margin-bottom:10px;}
.modal-ficha th{background:none;padding:6px 10px 6px 0;width:120px;font-size:11.5px;border-bottom:1px solid var(--line-2);text-transform:none;letter-spacing:0;color:var(--mute);}
.modal-ficha td{padding:6px 0;}
.modal-desc{background:var(--line-2);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.55;}
.hist{list-style:none;margin:0;padding:0;font-size:12.5px;}
.hist li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-2);}
.hist em{font-style:normal;color:var(--mute);white-space:nowrap;}

/* ===== mais ===== */
.mais-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px;}
.mais-it{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;text-align:left;color:var(--ink);box-shadow:var(--sh);}
.mais-it span{font-size:24px;margin-bottom:4px;} .mais-it small{font-weight:400;color:var(--mute);font-size:12px;}
.mais-acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.nuvem-linha{font-size:13px;}

/* ===== login ===== */
#login-overlay{position:fixed;inset:0;background:linear-gradient(160deg,var(--pri),var(--pri-ink));display:none;align-items:center;justify-content:center;z-index:4000;padding:20px;}
#login-overlay.show{display:flex;}
.login-box{background:#fff;border-radius:20px;padding:30px 24px;width:100%;max-width:360px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);}
.login-logo{font-size:40px;}
.login-box h2{margin:6px 0 4px;color:var(--pri);}
.login-sub{font-size:13px;color:var(--mute);margin:0 0 16px;}
.login-msg{background:var(--warn-soft);color:#7a4a03;border-radius:10px;padding:8px 10px;font-size:12.5px;margin-bottom:10px;}
.login-box input{width:100%;padding:13px;border:1px solid #ddd5c9;border-radius:12px;font-size:16px;margin-bottom:10px;}

/* ===== responsivo ===== */
@media (max-width:1200px){ .kpis{grid-template-columns:repeat(3,1fr);} }
@media (max-width:1100px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:1fr;} .two-col{grid-template-columns:1fr;} }
@media (max-width:860px){
  html,body{overflow-x:hidden;}
  body{font-size:15px;}
  .container{display:block;}
  .sidebar{display:none;}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px;padding-top:max(10px, env(safe-area-inset-top));}
  .topbar img{width:32px;border-radius:7px;}
  .topbar b{font-size:16px;color:var(--pri);flex:1;}
  .topbar .nuv{font-size:18px;cursor:pointer;}
  #tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:100;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 4px;padding-bottom:max(6px, env(safe-area-inset-bottom));}
  #tabbar button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;color:var(--mute);font-family:inherit;padding:4px 0;cursor:pointer;}
  #tabbar button span{font-size:20px;line-height:1.2;filter:grayscale(1);opacity:.7;}
  #tabbar button.on{color:var(--pri);font-weight:700;} #tabbar button.on span{filter:none;opacity:1;}
  #tabbar .fab span{width:52px;height:52px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;filter:none!important;opacity:1!important;margin-top:-22px;box-shadow:0 6px 16px rgba(135,52,28,.4);}
  .content{padding:16px 14px;padding-bottom:calc(96px + env(safe-area-inset-bottom));max-width:100%;}
  .header{flex-direction:column;align-items:stretch;gap:10px;margin-bottom:14px;}
  .header h2{font-size:23px;}
  .header-actions .btn{flex:1;}
  .menu{left:0;right:auto;min-width:240px;}
  .kpis{grid-template-columns:repeat(2,1fr);gap:10px;}
  .kpi{padding:12px;} .kpi b{font-size:19px;}
  .kpi.destaque{grid-column:1/-1;}
  .grid-4,.grid-2{grid-template-columns:repeat(2,1fr);gap:10px;}
  .form-grid,.form-grid.cols-3{grid-template-columns:1fr;}
  .form-grid > .fg{grid-column:1/-1!important;}
  .savebar .btn-outline{order:3;flex-basis:100%;}
  .fg input,.fg select,.fg textarea,.busca-bar input,.filtros-ext select,.filtros-ext input,.toolbar input[type=text],.med input{font-size:16px;}
  .medidas-grid{grid-template-columns:repeat(3,1fr);}
  .canais{grid-template-columns:1fr;}
  .foto-thumb,.foto-add{width:calc(33.3% - 7px);}
  .fsec{padding:14px;}
  .savebar{bottom:calc(64px + env(safe-area-inset-bottom));margin:0 -14px;padding:10px 14px;}
  .savebar .btn{flex:1;}
  .savebar span[style]{display:none;}
  .filtros-ext{grid-template-columns:1fr 1fr;}
  .filtro-btn{padding:10px;}
  .cat-grid{grid-template-columns:repeat(2,1fr);gap:10px;}
  .cat-info{padding:8px 10px 10px;}
  .cat-nome{font-size:13px;}
  #modal{padding:0;}
  .modal-box{border-radius:0;min-height:100%;padding:10px 14px calc(30px + env(safe-area-inset-bottom));}
  .modal-top{position:sticky;top:0;background:#fff;z-index:5;padding:6px 0;margin:0 0 8px;}
  .modal-grid{grid-template-columns:1fr;gap:14px;}
  .modal-galeria{position:static;}
  .acoes-grid{grid-template-columns:repeat(4,1fr);gap:6px;}
  .acao{font-size:11px;padding:9px 2px;}
  .mais-grid{grid-template-columns:repeat(2,1fr);}
  .tabs{width:100%;} .tabs button{flex:1;}
  table{font-size:12.5px;} th{padding:8px 10px;} td{padding:9px 10px;}
  .hbar{grid-template-columns:80px 1fr auto;}
  .toast{top:max(12px, env(safe-area-inset-top));}
}
@media print{ .sidebar,.topbar,#tabbar{display:none;} }
</style>
</head>

<script>
/* ==================== ESTADO E PERSISTÊNCIA ==================== */
const STORAGE_KEY = 'tearBrechoData';

function defaultState(){
  return {
    section: 'inicio',
    fornecedores: [],
    marcas: [],
    produtos: [],
    clientes: [],
    movimentacoes: [],
    vendas: [],
    custos: [],
    contadorProduto: 1,
    showForm: false,
    editId: null,
    filtroProdutos: '',
    filtroClientes: '',
    filtroFluxo: 'todos',
    vendaCart: [],
    vendaForm: { clienteBusca:'', pagamento:'Pix', data:'', taxaCartao:'', comissao:'', frete:'', canal:'WhatsApp' },
    config: {},
    showQuickCliente: false,
    showQuickFornecedor: false,
    estoqueLote: false,
    estoqueLoteSel: {},
    vendaSelecionadas: {},
    catFiltro: { status:'disponiveis', ordem:'recentes' }
  };
}

let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed, { showForm:false, editId:null, modoSelecao:false, selecao:{}, vendaCart:[], vendaForm: defaultState().vendaForm, showQuickCliente:false, showQuickFornecedor:false, estoqueLote:false, estoqueLoteSel:{}, vendaSelecionadas:{} });
  }catch(e){
    return defaultState();
  }
}

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){ /* ignora erro de storage */ }
  if(typeof agendarSync === 'function') agendarSync();
}

/* ==================== HELPERS ==================== */
function esc(str){
  if(str === undefined || str === null) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function fmt(v){ return 'R$ ' + (Number(v)||0).toFixed(2).replace('.', ','); }
function todayStr(){ return new Date().toISOString().split('T')[0]; }
function currentMonthPrefix(){ return new Date().toISOString().slice(0,7); }
function uid(){ return Date.now() + Math.floor(Math.random()*1000); }

function numVal(id){ const v = parseFloat(val(id)); return isNaN(v) ? 0 : v; }
function intVal(id){ const v = parseInt(val(id)); return isNaN(v) ? 0 : v; }

function confirmSafe(msg){

/* ==================== BUSCA COM AUTOCOMPLETE (datalist) ==================== */
function labelProduto(p){
  const marca = p.marcaId ? state.marcas.find(m=>m.id===p.marcaId) : null;
  return p.nome + (marca ? ' · '+marca.nome : '') + ' — ' + p.codigo;
}
function labelCliente(c){ return c.nome + (c.telefone ? ' — '+c.telefone : ''); }
function labelFornecedor(f){ return f.nome + (f.contato ? ' — '+f.contato : ''); }
function labelMarca(m){ return m.nome; }

function optsProdutos(list){ return (list||state.produtos).map(p=>`<option data-id="${p.id}" value="${esc(labelProduto(p))}">`).join(''); }
function optsClientes(list){ return (list||state.clientes).map(c=>`<option data-id="${c.id}" value="${esc(labelCliente(c))}">`).join(''); }
function optsFornecedores(list){ return (list||state.fornecedores).map(f=>`<option data-id="${f.id}" value="${esc(labelFornecedor(f))}">`).join(''); }
function optsMarcas(list){ return (list||state.marcas).map(m=>`<option data-id="${m.id}" value="${esc(labelMarca(m))}">`).join(''); }

function findProdutoByLabel(text){
  if(!text) return null;
  const t = text.trim();
  return state.produtos.find(p => labelProduto(p) === t) || state.produtos.find(p => p.nome.toLowerCase() === t.toLowerCase()) || null;
}
function findClienteByLabel(text){
  if(!text) return null;
  const t = text.trim();
  return state.clientes.find(c => labelCliente(c) === t) || state.clientes.find(c => c.nome.toLowerCase() === t.toLowerCase()) || null;
}
function findFornecedorByLabel(text){
  if(!text) return null;
  const t = text.trim();
  return state.fornecedores.find(f => labelFornecedor(f) === t) || state.fornecedores.find(f => f.nome.toLowerCase() === t.toLowerCase()) || null;
}
function findMarcaByLabel(text){
  if(!text) return null;
  const t = text.trim();
  return state.marcas.find(m => labelMarca(m) === t) || state.marcas.find(m => m.nome.toLowerCase() === t.toLowerCase()) || null;
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=> t.classList.remove('show'), 2200);
}

/* ==================== BACKUP (EXPORTAR / IMPORTAR ARQUIVO) ==================== */
function exportarBackup(){
  try{
    const dados = {
      fornecedores: state.fornecedores, marcas: state.marcas, produtos: state.produtos, clientes: state.clientes,
      movimentacoes: state.movimentacoes, vendas: state.vendas, custos: state.custos,
      contadorProduto: state.contadorProduto, config: state.config,
      exportadoEm: new Date().toISOString()
    };
    const blob = new Blob([JSON.stringify(dados, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const dataStr = todayStr();
    a.href = url;
    a.download = 'tear-brecho-backup-'+dataStr+'.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    showToast('Backup salvo em arquivo');
  }catch(e){
    showToast('Não foi possível gerar o backup');
  }
}

function importarBackup(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const dados = JSON.parse(e.target.result);
      if(!dados || typeof dados !== 'object'){ throw new Error('formato inválido'); }
      const camposEsperados = ['produtos','clientes','fornecedores'];
      const valido = camposEsperados.some(c => Array.isArray(dados[c]));
      if(!valido){ showToast('Arquivo não parece ser um backup do Tear Brechó'); inputEl.value=''; return; }
      if(!confirmSafe('Isso vai SUBSTITUIR todos os dados atuais pelos dados do arquivo. Deseja continuar?')){ inputEl.value=''; return; }
      state.fornecedores = dados.fornecedores || [];
      state.marcas = dados.marcas || [];
      state.produtos = dados.produtos || [];
      state.clientes = dados.clientes || [];
      state.movimentacoes = dados.movimentacoes || [];
      state.vendas = dados.vendas || [];
      state.custos = dados.custos || [];
      state.contadorProduto = dados.contadorProduto || (state.produtos.length + 1);
      state.config = dados.config || state.config || {};
      state.showForm = false; state.editId = null; state.vendaCart = [];
      saveState();
      showToast('Backup restaurado com sucesso');
      render();
    }catch(err){
      showToast('Erro ao ler o arquivo de backup');
    }
    inputEl.value = '';
  };
  reader.readAsText(file);
}

/* ==================== MÉTRICAS ==================== */
function diasEntre(a, b){ if(!a || !b) return null; return Math.max(0, Math.round((new Date(b) - new Date(a)) / 86400000)); }
function diasEmEstoque(p){ return diasEntre(p.dataEntrada, todayStr()); }
function margemPct(p){ const pv = precoAtual(p); return pv > 0 ? Math.round((pv - (p.precoCusto||0)) / pv * 100) : 0; }
function pendencias(p){
  const out = [];
  if(statusProduto(p).txt !== 'Disponível') return out;
  if((p.fotos||[]).length < 3) out.push((p.fotos||[]).length ? 'menos de 3 fotos' : 'sem foto');
  if(!(p.descricao||'').trim()) out.push('sem descrição');
  return out;
}
function vendasDoPeriodo(diasAtras){
  const ini = new Date(); ini.setDate(ini.getDate() - diasAtras); const iniStr = ini.toISOString().slice(0,10);
  return state.vendas.filter(v => (v.data||'') >= iniStr);
}
function lucroBrutoVenda(v){
  return (v.itens||[]).reduce((s,i)=>{ const p = state.produtos.find(x=>x.id===i.produtoId); return s + i.subtotal - (p ? (p.precoCusto||0) * i.quantidade : 0); }, 0)
    - (Number(v.taxaCartao)||0) - (Number(v.comissaoFornecedor)||0) - (Number(v.frete)||0);
}

/* ==================== PEÇAS (catálogo + produtos + estoque) ==================== */
function pf(){ if(!state.pecasFiltro) state.pecasFiltro = { status:'disponiveis', ordem:'recentes', visao:'grade' }; return state.pecasFiltro; }
function filtrarPecas(statusOverride){
  const f = pf();
  const st = statusOverride !== undefined ? statusOverride : f.status;
  const busca = semAcento((f.busca||'').toLowerCase().trim());
  let lista = state.produtos.filter(p => {
    const s = statusProduto(p).txt;
    if(st === 'disponiveis' && s !== 'Disponível') return false;
    if(st === 'reservados' && s !== 'Reservado') return false;
    if(st === 'vendidos' && s !== 'Vendido') return false;
    if(st === 'inativos' && s !== 'Inativo') return false;
    if(st === 'pendencias' && !pendencias(p).length) return false;
    if(st === 'paradas' && !(s === 'Disponível' && (diasEmEstoque(p)||0) > DIAS_PARADA)) return false;
    if(st === 'naopublicadas' && !(s === 'Disponível' && p.publicarWhatsapp !== false && !p.publicadoWhatsappEm)) return false;
    if(f.categoria && p.categoria !== f.categoria) return false;
    if(f.marca && String(p.marcaId) !== String(f.marca)) return false;
    if(f.tamanho && semAcento((p.variacoes||'').toLowerCase()).indexOf(semAcento(f.tamanho.toLowerCase())) < 0) return false;
    if(busca){
      const alvo = semAcento([p.nome, p.codigo, p.sku, p.categoria, nomeMarca(p), p.cor, p.material, p.epoca, p.descricao, p.tags, p.variacoes, p.localizacao].join(' ').toLowerCase());
      if(!busca.split(/\s+/).every(t => alvo.indexOf(t) >= 0)) return false;
    }
    return true;
  });
  const ord = f.ordem || 'recentes';
  if(ord === 'menor') lista.sort((a,b)=>precoAtual(a)-precoAtual(b));
  else if(ord === 'maior') lista.sort((a,b)=>precoAtual(b)-precoAtual(a));
  else if(ord === 'nome') lista.sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
  else if(ord === 'antigas') lista.sort((a,b)=>(a.dataEntrada||'').localeCompare(b.dataEntrada||'') || a.id-b.id);
  else lista.sort((a,b)=>(b.dataEntrada||'').localeCompare(a.dataEntrada||'') || (b.id - a.id));
  return lista;
}
const filtrarCatalogo = () => (state.selecao && Object.keys(state.selecao).length) ? state.produtos.filter(p=>state.selecao[p.id]) : filtrarPecas();
function setPf(k, v){ state.pecasFiltro = Object.assign({}, pf(), { [k]: v }); render(); }

function renderPecas(){
  if(state.showForm) return renderFormPeca();
  const f = pf();
  const lista = filtrarPecas();
  const cont = st => filtrarPecas(st).length;
  const chips = [['disponiveis','Disponíveis'],['reservados','Reservadas'],['vendidos','Vendidas'],['','Todas'],['pendencias','⚠️ Pendências'],['paradas','🐢 Paradas'],['naopublicadas','💬 Não publicadas'],['inativos','Inativas']];
  const marcasUsadas = state.marcas.filter(m => state.produtos.some(p => p.marcaId == m.id));
  const sel = state.selecao || {};
  const nSel = Object.keys(sel).length;
  const modoSel = !!state.modoSelecao;
  const disp = state.produtos.filter(p => statusProduto(p).txt === 'Disponível');

  return `
    <div class="header">
      <div><h2>Peças</h2><div class="sub">${disp.reduce((s,p)=>s+(p.estoque||0),0)} à venda · ${state.produtos.length} cadastrada(s) no total</div></div>
      <div class="header-actions">
        <button class="btn btn-primary" onclick="novaPeca()">＋ Nova peça</button>
        <div class="menu-wrap">
          <button class="btn btn-outline" onclick="this.nextElementSibling.classList.toggle('open')">⋯ Mais</button>
          <div class="menu">
            <button onclick="alternarSelecao()">☑️ ${modoSel?'Sair da seleção':'Selecionar várias'}</button>
            <button onclick="exportarWoo()">🛒 Exportar para WooCommerce (CSV)</button>
            <button onclick="imprimirCatalogo()">🖨️ Catálogo em PDF</button>
            <button onclick="imprimirEtiquetas()">🏷️ Imprimir etiquetas</button>
            ${state.produtos.some(p=>!p.sku)?`<button onclick="gerarSkusFaltantes()">⚙️ Gerar SKUs que faltam</button>`:''}
          </div>
        </div>
      </div>
    </div>

    <div class="chips">${chips.map(([k,l])=>`<button class="chip ${f.status===k?'on':''}" onclick="setPf('status','${k}')">${l}<b>${cont(k)}</b></button>`).join('')}</div>

    <div class="busca-bar">
      <input type="search" id="busca-pecas" placeholder="🔍 Buscar por nome, SKU, marca, cor, tecido..." value="${esc(f.busca||'')}" oninput="state.pecasFiltro.busca=this.value; render();">
      <button class="btn btn-gray filtro-btn" onclick="document.getElementById('filtros-ext').classList.toggle('hidden')">⚙️ Filtros${(f.categoria||f.marca||f.tamanho)?' •':''}</button>
      <div class="visao">
        <button class="${f.visao!=='lista'?'on':''}" title="Grade" onclick="setPf('visao','grade')">▦</button>
        <button class="${f.visao==='lista'?'on':''}" title="Lista" onclick="setPf('visao','lista')">☰</button>
      </div>
    </div>
    <div id="filtros-ext" class="filtros-ext ${(f.categoria||f.marca||f.tamanho)?'':'hidden'}">
      <select onchange="setPf('categoria', this.value)"><option value="">Todas as categorias</option>${CATEGORIAS_PRODUTO.map(c=>`<option ${f.categoria===c?'selected':''}>${c}</option>`).join('')}</select>
      <select onchange="setPf('marca', this.value)"><option value="">Todas as marcas</option>${marcasUsadas.map(m=>`<option value="${m.id}" ${String(f.marca)===String(m.id)?'selected':''}>${esc(m.nome)}</option>`).join('')}</select>
      <input type="text" placeholder="Tamanho" value="${esc(f.tamanho||'')}" onchange="setPf('tamanho', this.value)">
      <select onchange="setPf('ordem', this.value)">
        ${[['recentes','Mais recentes'],['antigas','Mais antigas'],['menor','Menor preço'],['maior','Maior preço'],['nome','Nome A-Z']].map(([k,l])=>`<option value="${k}" ${f.ordem===k?'selected':''}>${l}</option>`).join('')}
      </select>
      ${(f.categoria||f.marca||f.tamanho)?`<button class="btn btn-gray btn-sm" onclick="state.pecasFiltro=Object.assign(pf(),{categoria:'',marca:'',tamanho:''}); render();">Limpar</button>`:''}
    </div>

    ${modoSel ? `<div class="selbar">
      <b>${nSel} selecionada(s)</b>
      <button class="btn btn-sm btn-outline" onclick="selecionarTodas()">Todas da lista</button>
      ${nSel?`
      <button class="btn btn-sm btn-gray" onclick="loteStatus('Reservado')">⏸️ Reservar</button>
      <button class="btn btn-sm btn-gray" onclick="loteStatus('')">✅ Disponível</button>
      <button class="btn btn-sm btn-gray" onclick="loteStatus('Inativo')">🚫 Inativar</button>
      <button class="btn btn-sm btn-gray" onclick="imprimirEtiquetas()">🏷️ Etiquetas</button>
      <button class="btn btn-sm btn-gray" onclick="exportarWoo()">🛒 WooCommerce</button>
      <button class="btn btn-sm btn-gray" onclick="copiarTextosLote()">💬 Copiar textos</button>`:''}
      <button class="btn btn-sm btn-primary" onclick="alternarSelecao()">Concluir</button>
    </div>` : ''}

    ${lista.length === 0 ? `<div class="vazio"><div>👗</div><b>${state.produtos.length ? 'Nenhuma peça encontrada' : 'Nenhuma peça cadastrada ainda'}</b><p>${state.produtos.length ? 'Tente mudar os filtros ou a busca.' : 'Cadastre a primeira peça com fotos e descrição.'}</p>${state.produtos.length?'':'<button class="btn btn-primary" onclick="novaPeca()">＋ Nova peça</button>'}</div>` :
      (f.visao === 'lista' ? renderListaPecas(lista, modoSel, sel) : `<div class="cat-grid">${lista.map(p=>cardPeca(p, modoSel, sel)).join('')}</div>`)}
  `;
}

function cardPeca(p, modoSel, sel){
  const st = statusProduto(p);
  const capa = capaProduto(p);
  const marca = nomeMarca(p);
  const promo = p.precoPromo && p.precoPromo > 0 && p.precoPromo < p.precoVenda;
  const pend = pendencias(p);
  const dias = diasEmEstoque(p);
  return `
  <div class="cat-card ${modoSel && sel[p.id] ? 'sel' : ''}" onclick="${modoSel ? `toggleSel(${p.id})` : `abrirProduto(${p.id})`}">
    <div class="cat-foto">
      ${capa ? `<img src="${capa}" loading="lazy" alt="${esc(p.nome)}">` : `<div class="cat-semfoto">📷<span>Sem foto</span></div>`}
      ${modoSel ? `<span class="chk">${sel[p.id]?'✓':''}</span>` : `<span class="badge ${st.cls} cat-status">${st.txt}</span>`}
      ${promo ? `<span class="cat-promo">-${Math.round((1 - p.precoPromo/p.precoVenda)*100)}%</span>` : ''}
      <div class="cat-icons">
        ${p.publicadoWhatsappEm ? '<span title="Publicada no WhatsApp">💬✓</span>' : ''}
        ${(p.fotos||[]).length ? `<span class="${(p.fotos||[]).length<3?'warn':''}" title="Fotos">📷${p.fotos.length}</span>` : ''}
        ${(p.estoque||0) > 1 ? `<span title="Quantidade">×${p.estoque}</span>` : ''}
      </div>
    </div>
    <div class="cat-info">
      ${marca ? `<div class="cat-marca">${esc(marca)}</div>` : ''}
      <div class="cat-nome">${esc(p.nome)}</div>
      <div class="cat-meta">${[p.variacoes ? 'Tam. '+esc(p.variacoes) : '', esc(p.cor||'')].filter(Boolean).join(' · ')}</div>
      <div class="cat-preco">${promo ? `<s>${fmt(p.precoVenda)}</s> ` : ''}<b>${fmt(precoAtual(p))}</b></div>
      <div class="cat-sku">${esc(p.sku || p.codigo)}${st.txt==='Disponível' && dias > DIAS_PARADA ? ` · <span class="parada">${dias}d</span>` : ''}</div>
      ${pend.length ? `<div class="cat-pend">⚠️ ${pend.join(', ')}</div>` : ''}
    </div>
  </div>`;
}

function renderListaPecas(lista, modoSel, sel){
  return `<div class="panel"><div class="table-wrap"><table class="lista-pecas">
    <thead><tr>${modoSel?'<th></th>':''}<th></th><th>Peça</th><th>SKU</th><th>Tam.</th><th>Local</th><th style="text-align:right;">Custo</th><th style="text-align:right;">Preço</th><th style="text-align:right;">Margem</th><th style="text-align:center;">Qtd.</th><th>Status</th><th style="text-align:right;">Dias</th></tr></thead>
    <tbody>${lista.map(p=>{ const st = statusProduto(p); const capa = capaProduto(p); return `
      <tr onclick="${modoSel ? `toggleSel(${p.id})` : `abrirProduto(${p.id})`}" class="clicavel ${modoSel && sel[p.id]?'sel':''}">
        ${modoSel?`<td><span class="chk-mini">${sel[p.id]?'✓':''}</span></td>`:''}
        <td>${capa?`<img class="thumb-mini" src="${capa}" loading="lazy">`:'<div class="thumb-vazio">📷</div>'}</td>
        <td><b>${esc(p.nome)}</b><div class="hint">${esc(nomeMarca(p)||'')}${p.categoria?' · '+esc(p.categoria):''}</div>${pendencias(p).length?`<div class="hint warn-t">⚠️ ${pendencias(p).join(', ')}</div>`:''}</td>
        <td><span class="pill mono">${esc(p.sku||p.codigo)}</span></td>
        <td>${esc(p.variacoes||'-')}</td>
        <td>${esc(p.localizacao||'-')}</td>
        <td style="text-align:right;">${fmt(p.precoCusto)}</td>
        <td style="text-align:right;"><b>${fmt(precoAtual(p))}</b></td>
        <td style="text-align:right;" class="${margemPct(p)>=0?'money-pos':'money-neg'}">${margemPct(p)}%</td>
        <td style="text-align:center;"><b>${p.estoque}</b></td>
        <td><span class="badge ${st.cls}">${st.txt}</span></td>
        <td style="text-align:right;">${st.txt==='Disponível' ? (diasEmEstoque(p) ?? '-') : '-'}</td>
      </tr>`; }).join('')}</tbody></table></div></div>`;
}

function alternarSelecao(){ state.modoSelecao = !state.modoSelecao; state.selecao = {}; render(); }
function toggleSel(id){ state.selecao = state.selecao || {}; if(state.selecao[id]) delete state.selecao[id]; else state.selecao[id] = true; render(); }
function selecionarTodas(){ state.selecao = {}; filtrarPecas().forEach(p => state.selecao[p.id] = true); render(); }
function pecasSelecionadas(){ return state.produtos.filter(p => (state.selecao||{})[p.id]); }
function loteStatus(status){
  const l = pecasSelecionadas(); if(!l.length) return;
  l.forEach(p => { p.status = status; if(status === 'Reservado') p.reservadoEm = todayStr(); });
  saveState(); render(); showToast(l.length + ' peça(s) atualizada(s)');
}
function copiarTextosLote(){
  const l = pecasSelecionadas(); if(!l.length) return;
  copiarTexto(l.map(textoWhatsApp).join('\n\n— — —\n\n'));
}

function editarProduto(id){ fecharModal(); state.section = 'pecas'; fotosEditKey = null; state.editId = id; state.showForm = true; render(); window.scrollTo(0,0); }
function editarDoModal(id){ editarProduto(id); }

          <div class="fg"><label>Categoria</label><select id="p-categoria"><option value="">Selecione</option>${CATEGORIAS_PRODUTO.map(c=>`<option ${editing?.categoria===c?'selected':''}>${c}</option>`).join('')}</select></div>
          <div class="fg full"><label>Descrição *</label><textarea id="p-descricao" rows="4" placeholder="Conte a história da peça: caimento, detalhes, como usar. Se tiver algum defeito, avise aqui.">${esc(editing?.descricao)}</textarea></div>
          <div class="fg"><label>Marca</label><input type="text" id="p-marca-busca" list="dl-marcas-produto" placeholder="Digite ou escolha" value="${esc(marcaAtual)}"><datalist id="dl-marcas-produto">${optsMarcas()}</datalist><div class="hint">Se a marca não existir, ela é criada ao salvar.</div></div>

          <div class="fg"><label>Preço de venda (R$) *</label><input type="number" inputmode="decimal" id="p-venda" step="0.01" placeholder="0,00" value="${editing?.precoVenda ?? ''}" oninput="atualizarMargem()"></div>

function atualizarMargem(){
  const el = document.getElementById('margem-box'); if(!el) return;
  const c = numVal('p-custo'), v = numVal('p-venda'), pr = numVal('p-promo');
  const fin = (pr > 0 && pr < v) ? pr : v;
  if(!fin){ el.innerHTML = ''; return; }
  const l = fin - c, m = Math.round(l / fin * 100);
  el.innerHTML = `Lucro por peça: <b class="${l>=0?'money-pos':'money-neg'}">${fmt(l)}</b> · margem <b>${m}%</b>${c>0?` · markup ${(fin/c).toFixed(1).replace('.',',')}x`:''}`;
}

function salvarProduto(id, outra){
  const nome = val('p-nome');
  const precoCusto = numVal('p-custo');
  const precoVenda = numVal('p-venda');
  if(!nome){ showToast('Coloque o nome da peça'); document.getElementById('p-nome').focus(); return; }
  if(!precoVenda){ showToast('Coloque o preço de venda'); document.getElementById('p-venda').focus(); return; }
  if(fotosEnviando > 0){ showToast('Aguarde as fotos terminarem de enviar'); return; }
  const descricao = (document.getElementById('p-descricao').value || '').trim();
  if(!descricao){ showToast('Escreva a descrição da peça'); document.getElementById('p-descricao').focus(); return; }
  if(fotosEdit.length < 3 && !confirmSafe('Esta peça tem ' + fotosEdit.length + ' foto(s). Para divulgar bem o ideal é 3 a 5.\n\nSalvar mesmo assim?')) return;

  let marca = findMarcaByLabel(val('p-marca-busca'));
  if(!marca && val('p-marca-busca')){ marca = { id: uid(), nome: val('p-marca-busca'), descricao:'' }; state.marcas.push(marca); }
  const forn = findFornecedorByLabel(val('p-fornecedor-busca'));
  const estoqueTxt = val('p-estoque');
  const anterior = id ? state.produtos.find(x=>x.id===id) : null;
  const status = val('p-status');
  const dados = {
    nome, descricao,
    sku: val('p-sku'),
    categoria: val('p-categoria'),
    estado: val('p-estado'),
    variacoes: val('p-variacoes'),
    fornecedorId: forn ? forn.id : null,
    marcaId: marca ? marca.id : null,
    dataEntrada: val('p-data-entrada') || todayStr(),
    precoCusto, precoVenda,
    lucro: precoVenda - precoCusto,
    estoque: estoqueTxt === '' ? (id ? 0 : 1) : intVal('p-estoque'),
    precoPromo: numVal('p-promo') || 0,
    status,
    reservadoEm: status === 'Reservado' ? (anterior && anterior.status === 'Reservado' && anterior.reservadoEm ? anterior.reservadoEm : todayStr()) : null,
    cor: val('p-cor'), material: val('p-material'), epoca: val('p-epoca'),
    medidas: { busto: val('p-m-busto'), cintura: val('p-m-cintura'), quadril: val('p-m-quadril'), ombro: val('p-m-ombro'), manga: val('p-m-manga'), comprimento: val('p-m-comprimento') },
    localizacao: val('p-local'),
    tags: val('p-tags'),
    peso: intVal('p-peso') || null,
    publicarWhatsapp: document.getElementById('p-c-whatsapp').checked,
    canais: { whatsapp: document.getElementById('p-c-whatsapp').checked, instagram: document.getElementById('p-c-instagram').checked, site: document.getElementById('p-c-site').checked },
    fotos: fotosEdit.slice(),
    atualizadoEm: new Date().toISOString()
  };
  const codigoFinal = anterior ? anterior.codigo : ('P' + String(state.contadorProduto).padStart(4,'0'));
  if(!dados.sku) dados.sku = gerarSku({ categoria: dados.categoria, marcaNome: marca ? marca.nome : '', variacoes: dados.variacoes }, codigoFinal);
  const rep = state.produtos.find(x => x.id !== id && x.sku && x.sku.toLowerCase() === dados.sku.toLowerCase());
  if(rep){ showToast('Esse SKU já é usado por: ' + rep.nome); return; }

  let novoId = id;
  if(anterior){
    if(anterior.estoque !== dados.estoque){
      const dif = dados.estoque - anterior.estoque;
      state.movimentacoes.push({ id: uid(), produtoId: id, produtoNome: nome, tipo: dif > 0 ? 'entrada' : 'saida', quantidade: Math.abs(dif), data: todayStr(), observacao: 'Ajuste na edição da peça' });
    }
    Object.assign(anterior, dados);
    showToast('Peça atualizada ✓');
  }else{
    novoId = uid();
    state.contadorProduto++;
    state.produtos.push({ id: novoId, codigo: codigoFinal, criadoEm: new Date().toISOString(), ...dados });
    if(dados.estoque > 0) state.movimentacoes.push({ id: uid(), produtoId: novoId, produtoNome: nome, tipo:'entrada', quantidade: dados.estoque, data: dados.dataEntrada, observacao: 'Cadastro da peça' });
    showToast('Peça cadastrada ✓');
  }
  saveState();
  if(outra){ fotosEditKey = null; state.editId = null; state.showForm = true; render(); window.scrollTo(0,0); return; }
  fecharFormulario();
  if(novoId) setTimeout(()=>abrirProduto(novoId), 50);
}

function deletarProduto(id){
  const p = state.produtos.find(x=>x.id===id); if(!p) return;
  const temVenda = state.vendas.some(v => (v.itens||[]).some(i=>i.produtoId===id));
  if(!confirmSafe(temVenda ? 'Esta peça tem vendas registradas. Excluir mesmo assim? (as vendas continuam no histórico)\n\nDica: você pode marcar como “Inativa” em vez de excluir.' : 'Excluir a peça “' + p.nome + '”?')) return;
  state.produtos = state.produtos.filter(x=>x.id!==id);
  saveState(); fecharModal(); fecharFormulario(); showToast('Peça excluída');
}

function ajustarEstoque(id){
  const p = state.produtos.find(x=>x.id===id); if(!p) return;
  const tipo = val('aj-tipo'), q = intVal('aj-qtd'), motivo = val('aj-motivo');
  if(!q || q < 1){ showToast('Informe a quantidade'); return; }
  if(tipo === 'saida' && q > p.estoque){ showToast('Estoque insuficiente (' + p.estoque + ')'); return; }
  p.estoque = tipo === 'entrada' ? p.estoque + q : p.estoque - q;
  state.movimentacoes.push({ id: uid(), produtoId: p.id, produtoNome: p.nome, tipo, quantidade: q, data: todayStr(), observacao: motivo });
  saveState(); render(); abrirProduto(id); showToast('Estoque atualizado: ' + p.estoque);
}
function duplicarPeca(id){
  const p = state.produtos.find(x=>x.id===id); if(!p) return;
  const novo = JSON.parse(JSON.stringify(p));
  novo.id = uid(); novo.codigo = 'P' + String(state.contadorProduto).padStart(4,'0'); state.contadorProduto++;
  novo.nome = p.nome + ' (cópia)'; novo.sku = ''; novo.fotos = []; novo.status = ''; novo.publicadoWhatsappEm = null; novo.dataEntrada = todayStr(); novo.estoque = 1; novo.criadoEm = new Date().toISOString();
  novo.sku = gerarSku({ categoria: novo.categoria, marcaNome: nomeMarca(novo), variacoes: novo.variacoes }, novo.codigo);
  state.produtos.push(novo); saveState(); showToast('Peça duplicada — coloque as fotos'); editarProduto(novo.id);
}
function mudarStatus(id, status){
  const p = state.produtos.find(x=>x.id===id); if(!p) return;
  p.status = status; p.reservadoEm = status === 'Reservado' ? todayStr() : null;
  saveState(); render(); abrirProduto(id);
  showToast(status === 'Reservado' ? 'Peça reservada' : 'Reserva removida');
}

/* ---------- Divulgação (WhatsApp / Instagram) ---------- */
function hashtag(s){ return '#' + semAcento(String(s||'')).toLowerCase().replace(/[^a-z0-9]/g,''); }
function linhasDetalhes(p, negrito){
  const b = t => negrito ? '*' + t + '*' : t;
  const l = [];
  const marca = nomeMarca(p);
  if(marca) l.push('🏷️ ' + b('Marca:') + ' ' + marca);
  if(p.variacoes) l.push('📏 ' + b('Tamanho:') + ' ' + p.variacoes);
  const med = medidasTexto(p); if(med) l.push('📐 ' + b('Medidas:') + ' ' + med);
  if(p.cor) l.push('🎨 ' + b('Cor:') + ' ' + p.cor);
  if(p.material) l.push('🧵 ' + b('Tecido:') + ' ' + p.material);
  if(p.estado) l.push('⭐ ' + b('Estado:') + ' ' + p.estado);
  return l;
}
function textoPreco(p, negrito){
  const promo = p.precoPromo && p.precoPromo > 0 && p.precoPromo < p.precoVenda;
  return promo ? `💰 De ~${fmt(p.precoVenda)}~ por ${negrito?'*':''}${fmt(p.precoPromo)}${negrito?'*':''}` : `💰 ${negrito?'*':''}${fmt(p.precoVenda)}${negrito?'*':''}`;
}
function textoWhatsApp(p){
  const c = cfg();
  const l = ['✨ *' + p.nome.toUpperCase() + '* ✨', ''];
  l.push(...linhasDetalhes(p, true));
  if(p.descricao){ l.push(''); l.push(p.descricao); }
  l.push(''); l.push(textoPreco(p, true));
  l.push('🔖 Cód: ' + (p.sku || p.codigo));
  if(c.rodapeWhats){ l.push(''); l.push(c.rodapeWhats); }
  return l.join('\n');
}
function textoInstagram(p){
  const c = cfg();
  const l = ['✨ ' + p.nome + ' ✨', ''];
  if(p.descricao){ l.push(p.descricao); l.push(''); }
  l.push(...linhasDetalhes(p, false));
  l.push(''); l.push(textoPreco(p, false).replace(/~/g,''));
  l.push('🔖 Cód: ' + (p.sku || p.codigo));
  if(c.rodapeInsta){ l.push(''); l.push(c.rodapeInsta); }
  const tags = [c.hashtags, p.categoria ? hashtag('brecho' + p.categoria) : '', nomeMarca(p) ? hashtag(nomeMarca(p)) : '', p.epoca ? hashtag(p.epoca) : '', ...(p.tags||'').split(',').map(t=>t.trim()).filter(Boolean).map(hashtag)].filter(Boolean).join(' ');
  l.push(''); l.push(tags);
  return l.join('\n');
}
const textoAnuncio = textoWhatsApp;
function copiarAnuncio(id){ const p = state.produtos.find(x=>x.id===id); if(p) copiarTexto(textoWhatsApp(p)); }

async function arquivosDaPeca(p){
  const files = [];
  for(let k=0; k<(p.fotos||[]).length; k++){
    const r = await fetch(urlFoto(p.fotos[k]));
    const b = await r.blob();
    files.push(new File([b], (p.sku||p.codigo) + '-' + (k+1) + '.jpg', { type: b.type || 'image/jpeg' }));
  }
  return files;
}
async function compartilharPeca(id, destino){
  const p = state.produtos.find(x=>x.id===id); if(!p) return;
  const texto = destino === 'instagram' ? textoInstagram(p) : textoWhatsApp(p);
  copiarTextoSilencioso(texto);
  try{
    showToast('Preparando fotos...');
    const files = await arquivosDaPeca(p);
    if(files.length && navigator.canShare && navigator.canShare({ files })){
      await navigator.share({ files, text: texto });
      showToast(destino === 'instagram' ? 'Legenda copiada — cole no post 📸' : 'Enviado! (o texto também está copiado)');
      return;
    }
  }catch(e){ if(e && e.name === 'AbortError') return; }
  // computador / navegador sem compartilhamento: baixa as fotos e copia o texto
  if((p.fotos||[]).length) baixarFotos(id);
  showToast('Texto copiado e fotos baixadas — é só colar e anexar');
  if(destino === 'whatsapp' && !(navigator.canShare)) window.open('https://wa.me/?text=' + encodeURIComponent(texto), '_blank');
}
function copiarTextoSilencioso(txt){ try{ if(navigator.clipboard) navigator.clipboard.writeText(txt).catch(()=>{}); }catch(e){} }
async function baixarFotos(id){
  const p = state.produtos.find(x=>x.id===id); if(!p) return;
  for(let k=0; k<(p.fotos||[]).length; k++){
    const a = document.createElement('a'); a.href = urlFoto(p.fotos[k]); a.download = (p.sku||p.codigo) + '-' + (k+1) + '.jpg';
    document.body.appendChild(a); a.click(); a.remove(); await new Promise(r=>setTimeout(r, 350));
  }
}
function venderDoModal(id){
  const p = state.produtos.find(x=>x.id===id); if(!p) return;
  fecharModal();
  state.section = 'vendas'; state.showForm = true; state.editId = null;
  const pr = precoAtual(p);
  state.vendaCart = [{ produtoId: p.id, produtoNome: p.nome, quantidade: 1, precoUnit: pr, subtotal: Math.round(pr*100)/100 }];
  state.vendaForm = { clienteBusca:'', pagamento:'Pix', data:'', taxaCartao:'', comissao:'', frete:'', canal:'WhatsApp' };
  render(); window.scrollTo(0,0);
  showToast('Peça no carrinho — confira e finalize');
}

/* ---------- WooCommerce (CSV para importar) ---------- */
function urlFotoPublica(n){ return location.origin + location.pathname.replace(/[^\/]*$/, '') + 'fotos/' + encodeURIComponent(n); }
function csvCampo(v){ const s = v === null || v === undefined ? '' : String(v); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; }
function exportarWoo(){
  let lista = pecasSelecionadas();
  if(!lista.length) lista = state.produtos.filter(p => statusProduto(p).txt === 'Disponível' && !(p.canais && p.canais.site === false));
  if(!lista.length){ showToast('Nenhuma peça para exportar'); return; }
  const cab = ['SKU','Name','Type','Published','Is featured?','Visibility in catalog','Short description','Description','In stock?','Stock','Sale price','Regular price','Categories','Tags','Images','Weight (kg)','Attribute 1 name','Attribute 1 value(s)','Attribute 1 visible','Attribute 1 global','Attribute 2 name','Attribute 2 value(s)','Attribute 2 visible','Attribute 2 global','Attribute 3 name','Attribute 3 value(s)','Attribute 3 visible','Attribute 3 global','Brands'];
  const linhas = lista.map(p => {
    const promo = p.precoPromo && p.precoPromo > 0 && p.precoPromo < p.precoVenda;
    const curta = [nomeMarca(p), p.variacoes ? 'Tam. ' + p.variacoes : '', p.estado].filter(Boolean).join(' · ');
    const desc = (p.descricao || '').replace(/\n/g,'<br>') + (medidasTexto(p) ? '<br><br><strong>Medidas:</strong> ' + medidasTexto(p) : '') + (p.material ? '<br><strong>Tecido:</strong> ' + p.material : '') + (p.cor ? '<br><strong>Cor:</strong> ' + p.cor : '');
    const st = statusProduto(p).txt;
    return [p.sku || p.codigo, p.nome, 'simple', st === 'Disponível' ? 1 : 0, 0, 'visible', curta, desc, (p.estoque||0) > 0 ? 1 : 0, p.estoque || 0,
      promo ? p.precoPromo.toFixed(2) : '', (p.precoVenda||0).toFixed(2), p.categoria || '', (p.tags||'').split(',').map(t=>t.trim()).filter(Boolean).join(', '),
      (p.fotos||[]).map(urlFotoPublica).join(', '), p.peso ? (p.peso/1000).toFixed(3) : '',
      'Tamanho', p.variacoes || '', 1, 0, 'Cor', p.cor || '', 1, 0, 'Estado', p.estado || '', 1, 0, nomeMarca(p)].map(csvCampo).join(',');
  });
  const csv = '﻿' + cab.join(',') + '\n' + linhas.join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' }));
  a.download = 'tear-woocommerce-' + todayStr() + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  showToast(lista.length + ' peça(s) exportada(s) para o WooCommerce');
}

function revertMovimentacao(m){
  const produto = state.produtos.find(p=>p.id===m.produtoId);
  if(!produto) return;
  if(m.tipo==='entrada') produto.estoque = Math.max(0, produto.estoque - m.quantidade);
  else produto.estoque += m.quantidade;
}

  if(!m) return;
  if(!confirmSafe('Excluir esta movimentação? O estoque será ajustado de volta.')) return;
  revertMovimentacao(m);
  state.movimentacoes = state.movimentacoes.filter(x=>x.id!==id);
  saveState();
  render();
}

function adicionarMovimentacao(){
  const produto = findProdutoByLabel(val('e-produto-busca'));
  const tipo = val('e-tipo');
  const quantidade = intVal('e-quantidade');
  const data = val('e-data') || todayStr();
  const observacao = val('e-obs');
  if(!produto || !tipo || !quantidade){ showToast('Selecione um produto válido, tipo e quantidade'); return; }

  let estoqueBase = produto.estoque;
  let antiga = null;
  if(state.editId){
    antiga = state.movimentacoes.find(m=>m.id===state.editId);
    if(antiga && antiga.produtoId===produto.id){
      estoqueBase = antiga.tipo==='entrada' ? estoqueBase - antiga.quantidade : estoqueBase + antiga.quantidade;
    }
  }
  if(tipo==='saida' && quantidade > estoqueBase){ showToast('Estoque insuficiente. Disponível: '+estoqueBase); return; }

  if(antiga){
    revertMovimentacao(antiga);
    state.movimentacoes = state.movimentacoes.filter(m=>m.id!==antiga.id);
  }

  state.movimentacoes.push({ id: state.editId || uid(), produtoId: produto.id, produtoNome: produto.nome, tipo, quantidade, data, observacao });
  if(tipo==='entrada') produto.estoque += quantidade;
  else produto.estoque = Math.max(0, produto.estoque - quantidade);

  saveState();
  showToast(state.editId ? 'Movimentação atualizada' : 'Movimentação registrada');
  fecharFormulario();
}

function estoqueSimulado(produtoId){
  const produto = state.produtos.find(p=>p.id===produtoId);
  if(!produto) return 0;
  let base = produto.estoque;
  if(state.editId){
    const vendaAntiga = state.vendas.find(v=>v.id===state.editId);
    if(vendaAntiga) base += vendaAntiga.itens.filter(i=>i.produtoId===produtoId).reduce((s,i)=>s+i.quantidade,0);
  }
  const jaNoCarrinho = state.vendaCart.filter(i=>i.produtoId===produtoId).reduce((s,i)=>s+i.quantidade,0);
  return base - jaNoCarrinho;
}

function adicionarItemCarrinho(){
  const produto = findProdutoByLabel(val('v-produto-busca'));

  const quantidade = intVal('v-item-qtd') || 1;
  const precoDigitado = numVal('v-item-preco');
  const precoUnit = precoDigitado > 0 ? precoDigitado : produto.precoVenda;
  const disponivel = estoqueSimulado(produto.id);
  if(quantidade > disponivel){ showToast('Estoque insuficiente. Disponível: '+disponivel); return; }
  state.vendaCart.push({ produtoId: produto.id, produtoNome: produto.nome, quantidade, precoUnit, subtotal: Math.round(quantidade*precoUnit*100)/100 });
  document.getElementById('v-produto-busca').value = '';
  document.getElementById('v-item-qtd').value = '1';
  document.getElementById('v-item-preco').value = '';
  render();
}

function editarVenda(id){
  const venda = state.vendas.find(v=>v.id===id);
  if(!venda) return;
  state.editId = id;
  state.showForm = true;
  state.vendaCart = venda.itens.map(i=>({...i}));
  state.vendaForm = {
    clienteBusca: venda.clienteId ? labelCliente(state.clientes.find(c=>c.id===venda.clienteId) || {nome:venda.clienteNome,telefone:''}) : (venda.clienteNome||''),
    pagamento: venda.formaPagamento || 'Dinheiro',
    data: venda.data || todayStr(),
    taxaCartao: venda.taxaCartao || '',
    comissao: venda.comissaoFornecedor || '',
    frete: venda.frete || '',
    canal: venda.canal || 'WhatsApp'
  };

}

function reverterEfeitosVenda(id){
  const venda = state.vendas.find(v=>v.id===id);
  if(!venda) return;
  venda.itens.forEach(item=>{
    const produto = state.produtos.find(p=>p.id===item.produtoId);
    if(produto) produto.estoque += item.quantidade;
  });
  state.movimentacoes = state.movimentacoes.filter(m=>m.vendaId!==id);
  state.custos = state.custos.filter(c=>c.vendaId!==id);
  state.vendas = state.vendas.filter(v=>v.id!==id);
}

function deletarVenda(id){
  if(!confirmSafe('Excluir esta venda? O estoque dos produtos será restaurado.')) return;
  reverterEfeitosVenda(id);
  saveState();
  showToast('Venda excluída e estoque restaurado');
  render();
}

function registrarVenda(){
  if(state.vendaCart.length===0){ showToast('Adicione ao menos um produto à venda'); return; }

  const clienteResolvido = findClienteByLabel(val('v-cliente-busca'));
  const clienteNomeDigitado = val('v-cliente-busca');
  const formaPagamento = val('v-pagamento') || 'Dinheiro';
  const data = val('v-data') || todayStr();
  const taxaCartao = numVal('v-taxa-cartao');
  const comissaoFornecedor = numVal('v-comissao');
  const frete = numVal('v-frete');
  const idVenda = state.editId || uid();

  if(state.editId) reverterEfeitosVenda(state.editId);

  for(const item of state.vendaCart){
    const produto = state.produtos.find(p=>p.id===item.produtoId);
    if(!produto || item.quantidade > produto.estoque){
      showToast('Estoque insuficiente para '+(produto?produto.nome:item.produtoNome)+'. Refaça a venda.');
      saveState();
      render();
      return;
    }
  }

  const total = state.vendaCart.reduce((s,i)=>s+i.subtotal,0);
  const venda = {
    id: idVenda, data, formaPagamento,
    clienteId: clienteResolvido ? clienteResolvido.id : null,
    clienteNome: clienteResolvido ? clienteResolvido.nome : clienteNomeDigitado,
    itens: state.vendaCart.map(i=>({...i})),
    total, taxaCartao, comissaoFornecedor, frete,
    canal: val('v-canal') || 'WhatsApp'
  };
  state.vendas.push(venda);

  venda.itens.forEach(item=>{
    const produto = state.produtos.find(p=>p.id===item.produtoId);
    produto.estoque = Math.max(0, produto.estoque - item.quantidade);
    state.movimentacoes.push({ id: uid(), produtoId: item.produtoId, produtoNome: item.produtoNome, tipo:'saida', quantidade: item.quantidade, data, observacao:'Venda'+(venda.clienteNome?(' para '+venda.clienteNome):''), vendaId: venda.id });
  });

  const nomesResumo = venda.itens.map(i=>i.produtoNome).join(', ');
  state.custos.push({ id: uid(), tipo:'receita', natureza:null, categoria:'Venda', descricao: nomesResumo + (venda.clienteNome?(' - '+venda.clienteNome):''), valor: total, data, vendaId: venda.id });
  if(taxaCartao>0) state.custos.push({ id: uid(), tipo:'custo', natureza:'variavel', categoria:'Taxa de Cartão', descricao:'Taxa de cartão - venda de '+nomesResumo, valor: taxaCartao, data, vendaId: venda.id });
  if(comissaoFornecedor>0) state.custos.push({ id: uid(), tipo:'custo', natureza:'variavel', categoria:'Comissão Fornecedor', descricao:'Comissão - venda de '+nomesResumo, valor: comissaoFornecedor, data, vendaId: venda.id });
  if(frete>0) state.custos.push({ id: uid(), tipo:'custo', natureza:'variavel', categoria:'Frete', descricao:'Frete/embalagem - venda de '+nomesResumo, valor: frete, data, vendaId: venda.id });

  saveState();
  showToast(state.editId ? 'Venda atualizada' : 'Venda registrada com sucesso');
  fecharFormulario();
}

/* ==================== NUVEM (sincronização entre aparelhos) ==================== */
const API = 'api.php';
const TOKEN_KEY = 'tearBrechoToken';
const SYNC_KEY = 'tearBrechoSync'; // { versao, pendente }
const CAMPOS_DADOS = ['fornecedores','marcas','produtos','clientes','movimentacoes','vendas','custos','contadorProduto','config'];
let nuvem = { token: null, versao: 0, pendente: false, salvando: false, online: true, ultimo: null, timer: null, pronto: false };

function lerSync(){ try{ return JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; }catch(e){ return {}; } }
function gravarSync(){ try{ localStorage.setItem(SYNC_KEY, JSON.stringify({ versao: nuvem.versao, pendente: nuvem.pendente })); }catch(e){} }
function dadosParaNuvem(){ const d = {}; CAMPOS_DADOS.forEach(k => d[k] = state[k]); return d; }
function aplicarDadosNuvem(d){
  if(!d) return;
  CAMPOS_DADOS.forEach(k => { if(d[k] !== undefined) state[k] = d[k]; });
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}
function temDadosLocais(){ return ['produtos','clientes','vendas','fornecedores','marcas','custos','movimentacoes'].some(k => Array.isArray(state[k]) && state[k].length > 0); }
function nomeAparelho(){ const u = navigator.userAgent; return /iPhone/.test(u)?'iPhone':/iPad/.test(u)?'iPad':/Android/.test(u)?'Android':/Windows/.test(u)?'Windows':/Mac/.test(u)?'Mac':'Navegador'; }

async function api(acao, body, metodo){
  const opts = { method: metodo || (body ? 'POST' : 'GET'), headers: {} };
  if(nuvem.token) opts.headers['X-Token'] = nuvem.token;
  if(body){ opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(Object.assign({ token: nuvem.token }, body)); }
  const r = await fetch(API + '?acao=' + acao + '&_=' + Date.now(), opts);
  let j = {}; try{ j = await r.json(); }catch(e){}
  return { status: r.status, ok: r.ok, json: j };
}

function statusNuvemHTML(){
  if(!nuvem.pronto) return '☁️ Conectando...';
  if(nuvem.salvando) return '⏳ Salvando na nuvem...';
  if(nuvem.pendente && !nuvem.online) return '⚠️ Sem internet — salvo neste aparelho, envia quando voltar';
  if(nuvem.pendente) return '⏳ Alterações aguardando envio...';
  const h = nuvem.ultimo ? new Date(nuvem.ultimo).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '';
  return '☁️ Salvo na nuvem' + (h ? ' · ' + h : '');
}
function atualizarStatusNuvem(){
  const el = document.getElementById('nuvem-status');
  if(el) el.innerHTML = statusNuvemHTML();
  const m = document.getElementById('nuvem-status-mobile');
  if(m) m.textContent = nuvem.salvando ? '⏳' : (nuvem.pendente ? '⚠️' : '☁️');
  const m2 = document.getElementById('nuvem-status-2');
  if(m2) m2.innerHTML = statusNuvemHTML();
}

function agendarSync(){
  nuvem.pendente = true; gravarSync(); atualizarStatusNuvem();
  clearTimeout(nuvem.timer);
  nuvem.timer = setTimeout(enviarNuvem, 700);
}

async function enviarNuvem(forcar){
  if(!nuvem.token || !nuvem.pronto) return;
  if(nuvem.salvando){ clearTimeout(nuvem.timer); nuvem.timer = setTimeout(enviarNuvem, 800); return; }
  nuvem.salvando = true; atualizarStatusNuvem();
  try{
    const r = await api('salvar', { dados: dadosParaNuvem(), versaoBase: nuvem.versao, forcar: !!forcar, aparelho: nomeAparelho() });
    nuvem.online = true;
    if(r.status === 401){ nuvem.salvando = false; pedirLogin('Sua sessão expirou. Entre de novo — suas alterações estão guardadas neste aparelho.'); return; }
    if(r.status === 409){
      nuvem.salvando = false;
      const manterMinhas = confirmSafe('Outro aparelho salvou alterações no painel ao mesmo tempo.\n\nOK = manter as alterações DESTE aparelho (substitui as do outro)\nCancelar = carregar as alterações do outro aparelho');
      if(manterMinhas){ return enviarNuvem(true); }
      nuvem.versao = r.json.versao; nuvem.pendente = false; gravarSync();
      aplicarDadosNuvem(r.json.dados); render(); showToast('Dados atualizados do outro aparelho');
      return;
    }
    if(r.ok){
      nuvem.versao = r.json.versao; nuvem.ultimo = r.json.atualizadoEm; nuvem.pendente = false; gravarSync();
    }else{
      showToast('Erro ao salvar na nuvem (' + (r.json.erro || r.status) + ')');
    }
  }catch(e){
    nuvem.online = false;
    clearTimeout(nuvem.timer); nuvem.timer = setTimeout(enviarNuvem, 10000);
  }
  nuvem.salvando = false; atualizarStatusNuvem();
}

/* Busca alterações feitas em outros aparelhos */
async function verificarAtualizacoes(){
  if(!nuvem.pronto || !nuvem.token || nuvem.salvando) return;
  if(nuvem.pendente){ enviarNuvem(); return; }
  if(state.showForm) return; // não atrapalha quem está preenchendo formulário
  try{
    const r = await api('versao');
    nuvem.online = true;
    if(r.status === 401){ pedirLogin('Sua sessão expirou. Entre de novo.'); return; }
    if(r.ok && r.json.versao > nuvem.versao){
      const d = await api('dados');
      if(d.ok && !nuvem.pendente && !state.showForm){
        nuvem.versao = d.json.versao; nuvem.ultimo = d.json.atualizadoEm; gravarSync();
        aplicarDadosNuvem(d.json.dados); render();
        showToast('🔄 Painel atualizado com alterações de outro aparelho');
      }
    }
  }catch(e){ nuvem.online = false; }
  atualizarStatusNuvem();
}

/* Primeira carga: decide se usa os dados da nuvem ou envia os deste aparelho */
async function carregarDaNuvem(){
  const d = await api('dados');
  if(d.status === 401){ pedirLogin(); return; }
  if(!d.ok){ throw new Error('falha'); }
  const sync = lerSync();
  const servidorVazio = !d.json.dados || !d.json.versao;
  nuvem.pronto = true;
  if(servidorVazio){
    nuvem.versao = 0;
    if(temDadosLocais()){
      showToast('Enviando os dados deste aparelho para a nuvem...');
      await enviarNuvem(true);
      showToast('✅ Dados enviados! Agora qualquer aparelho vê o mesmo estoque');
    }
  }else if(sync.pendente && temDadosLocais() && sync.versao === d.json.versao){
    // alterações feitas offline neste aparelho, nuvem não mudou: envia
    nuvem.versao = d.json.versao; await enviarNuvem();
  }else if(sync.pendente && temDadosLocais() && sync.versao !== d.json.versao && sync.versao !== undefined){
    const manter = confirmSafe('Este aparelho tem alterações que não foram enviadas, e a nuvem também mudou.\n\nOK = enviar as alterações DESTE aparelho\nCancelar = usar os dados da nuvem');
    nuvem.versao = d.json.versao;
    if(manter){ await enviarNuvem(true); } else { aplicarDadosNuvem(d.json.dados); nuvem.pendente = false; gravarSync(); }
  }else if(!sync.versao && temDadosLocais() && JSON.stringify(dadosParaNuvem()) !== JSON.stringify(d.json.dados)){
    // aparelho que nunca sincronizou, com dados próprios, e a nuvem já tem dados
    const usarNuvem = confirmSafe('A nuvem já tem dados do painel, e este aparelho também tem dados salvos.\n\nOK = usar os dados da NUVEM (recomendado)\nCancelar = enviar os dados DESTE aparelho e substituir a nuvem');
    nuvem.versao = d.json.versao;
    if(usarNuvem){ aplicarDadosNuvem(d.json.dados); nuvem.pendente = false; gravarSync(); }
    else { await enviarNuvem(true); }
  }else{
    nuvem.versao = d.json.versao; nuvem.ultimo = d.json.atualizadoEm; nuvem.pendente = false; gravarSync();
    aplicarDadosNuvem(d.json.dados);
  }
  if(!nuvem.ultimo) nuvem.ultimo = d.json.atualizadoEm || new Date().toISOString();
  fecharLogin();
  render();
}

/* ---------- Tela de login ---------- */
function pedirLogin(msg, criar){
  nuvem.pronto = false;
  const el = document.getElementById('login-overlay');
  el.classList.add('show');
  el.innerHTML = `
    <div class="login-box">
      <div class="login-logo">🧵</div>
      <h2>Tear Brechó</h2>
      <p class="login-sub">${criar ? 'Primeiro acesso: crie a senha do painel. Ela será usada em todos os aparelhos (celular, computador...).' : 'Painel de estoque e vendas — entre com a senha do painel.'}</p>
      ${msg ? `<div class="login-msg">${esc(msg)}</div>` : ''}
      <input type="password" id="login-senha" placeholder="${criar ? 'Crie uma senha (mín. 6 caracteres)' : 'Senha'}" autocomplete="${criar?'new-password':'current-password'}" onkeydown="if(event.key==='Enter') ${criar?'criarSenha()':'fazerLogin()'}">
      ${criar ? `<input type="password" id="login-senha2" placeholder="Repita a senha" autocomplete="new-password" onkeydown="if(event.key==='Enter') criarSenha()">` : ''}
      <button class="btn btn-primary" style="width:100%;padding:12px;" onclick="${criar?'criarSenha()':'fazerLogin()'}">${criar ? 'Criar senha e entrar' : 'Entrar'}</button>
      <div class="hint" style="margin-top:12px;">Os dados ficam salvos com segurança no servidor do brechó.</div>
    </div>`;
  setTimeout(()=>{ const i = document.getElementById('login-senha'); if(i) i.focus(); }, 50);
}

async function criarSenha(){
  const s = document.getElementById('login-senha').value, s2 = document.getElementById('login-senha2').value;
  if(s.length < 6) return pedirLogin('A senha precisa ter pelo menos 6 caracteres.', true);
  if(s !== s2) return pedirLogin('As senhas não são iguais.', true);
  try{
    const r = await api('criar_senha', { senha: s });
    if(!r.ok){ return pedirLogin(r.json.erro === 'ja_configurado' ? 'A senha já foi criada. Entre com ela.' : 'Erro: ' + (r.json.erro||r.status), r.json.erro !== 'ja_configurado'); }
    nuvem.token = r.json.token; try{ localStorage.setItem(TOKEN_KEY, nuvem.token); }catch(e){}
    await carregarDaNuvem();
  }catch(e){ pedirLogin('Sem conexão com o servidor. Verifique a internet.', true); }
}
async function fazerLogin(){
  const s = document.getElementById('login-senha').value;
  if(!s) return;
  try{
    const r = await api('login', { senha: s });
    if(!r.ok){ return pedirLogin(r.json.erro === 'muitas_tentativas' ? 'Muitas tentativas. Aguarde 15 minutos.' : 'Senha incorreta.'); }
    nuvem.token = r.json.token; try{ localStorage.setItem(TOKEN_KEY, nuvem.token); }catch(e){}
    await carregarDaNuvem();
  }catch(e){ pedirLogin('Sem conexão com o servidor. Verifique a internet.'); }
}
async function sairPainel(){
  if(!confirmSafe('Sair do painel neste aparelho?')) return;
